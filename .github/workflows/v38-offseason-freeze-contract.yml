name: v38 Offseason Freeze Contract
on:
  pull_request:
    paths:
      - 'research/v38-offseason-freeze-2026.json'
      - 'research/V38_OFFSEASON_2027_HANDOFF.md'
      - 'test-v38-offseason-freeze.mjs'
      - '.github/workflows/v38-offseason-freeze-contract.yml'
  push:
    branches: [main]
    paths:
      - 'research/v38-offseason-freeze-2026.json'
      - 'research/V38_OFFSEASON_2027_HANDOFF.md'
      - 'test-v38-offseason-freeze.mjs'
      - '.github/workflows/v38-offseason-freeze-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node test-v38-offseason-freeze.mjs
