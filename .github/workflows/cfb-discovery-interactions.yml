name: CFB discovery interactions
on:
  push:
    branches: [research/cfb-market-model-v1]
    paths:
      - 'research/cfb/analyze-discovery-interactions.py'
      - '.github/workflows/cfb-discovery-interactions.yml'
  workflow_dispatch:

jobs:
  interactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow
      - name: Download public discovery data
        run: |
          curl -L --fail --retry 3 -o /tmp/games.parquet https://raw.githubusercontent.com/gmalbert/college-football-predictions/main/data_files/processed/games.parquet
          curl -L --fail --retry 3 -o /tmp/lines.parquet https://raw.githubusercontent.com/gmalbert/college-football-predictions/main/data_files/processed/lines.parquet
      - name: Run interaction stability analysis
        run: python research/cfb/analyze-discovery-interactions.py /tmp/games.parquet /tmp/lines.parquet cfb-discovery-interactions.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-discovery-interactions
          path: cfb-discovery-interactions.json
          retention-days: 30
