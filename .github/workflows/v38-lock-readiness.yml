name: v38 Lock Readiness
on:
  workflow_run:
    workflows: ['v38 Live Research Board']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/build-v38-lock-readiness.mjs'
      - 'scripts/build-v38-execution-draft-template.mjs'
      - 'scripts/build-v38-compression-escape-watch.mjs'
      - 'test-v38-lock-readiness.mjs'
      - 'test-v38-execution-draft-template.mjs'
      - 'test-v38-compression-escape-watch.mjs'
      - 'v38-locked-policy-core.mjs'
      - '.github/workflows/v38-lock-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  readiness:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contract preflight
        run: |
          node --check scripts/build-v38-lock-readiness.mjs
          node --check scripts/build-v38-execution-draft-template.mjs
          node --check scripts/build-v38-compression-escape-watch.mjs
          node test-v38-lock-readiness.mjs
          node test-v38-execution-draft-template.mjs
          node test-v38-compression-escape-watch.mjs
      - name: Download triggering live board
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          mkdir -p incoming/live-board
          RID='${{ github.event.workflow_run.id }}'
          gh run download "$RID" --repo "$GH_REPO" --name "v38-live-research-board-${RID}" --dir incoming/live-board
      - name: Download latest live board for push or manual run
        if: github.event_name != 'workflow_run'
        run: |
          set -euo pipefail
          mkdir -p incoming/live-board
          RID=$(gh api "repos/${GH_REPO}/actions/workflows/v38-live-research-board.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          gh run download "$RID" --repo "$GH_REPO" --name "v38-live-research-board-${RID}" --dir incoming/live-board
      - name: Build prospective lock readiness
        id: build
        run: |
          set -euo pipefail
          BOARD=$(find incoming/live-board -type f -name 'v38-live-research-board-*.json' | sort | tail -1)
          test -n "$BOARD"
          node scripts/build-v38-lock-readiness.mjs "$BOARD"
          node scripts/build-v38-compression-escape-watch.mjs "$BOARD"
          echo "board=$BOARD" >> "$GITHUB_OUTPUT"
      - name: Verify readiness artifact
        run: |
          set -euo pipefail
          F=$(find snapshots -type f -name 'v38-lock-readiness-*.json' | sort | tail -1)
          node --input-type=module - "$F" <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const z=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(z.protocol!=='BANDALYTICS_LOCK_READINESS_V2'||z.point_in_time!==true||z.research_only!==true||z.scoring_enabled!==false||z.production_rule_changed!==false||z.final_cut_promoted!==false)throw Error('unsafe readiness artifact');
          const {sha256,...body}=z,calc=crypto.createHash('sha256').update(JSON.stringify(body)).digest('hex');if(calc!==sha256)throw Error('readiness sha mismatch');
          for(const r of z.rows){
            if(r.readiness_state==='ACTIONABLE_REVIEW'&&(!r.locked_policy?.qualified||r.lineup_verified!==true))throw Error(`invalid actionable row ${r.player}`);
            if(r.locked_policy?.gate_count===4&&r.readiness_state==='ACTIONABLE_REVIEW'&&!(Number(r.american_odds)>=700))throw Error(`unprotected 4/6 actionable row ${r.player}`);
            const e=r.evidence_lane_inputs;if(!e||!e.PROFILE||!e.HEAT||!e.MATCHUP||!e.VALUE||!e.opportunity||!e.park_context)throw Error(`evidence inputs missing for ${r.player}`);
            if(e.VALUE.support!==null)throw Error(`VALUE must not auto-confirm from price for ${r.player}`);
            if(e.park_context.not_an_evidence_lane!==true)throw Error(`park incorrectly promoted for ${r.player}`);
          }
          console.log('V38_LOCK_READINESS_OK='+JSON.stringify({date:z.date,counts:z.counts,compression:z.compression_diagnostics}));
          NODE
      - name: Verify compression escape watch
        run: |
          set -euo pipefail
          F=$(find snapshots -type f -name 'v38-compression-escape-watch-*.json' | sort | tail -1)
          node --input-type=module - "$F" <<'NODE'
          import fs from 'node:fs';import crypto from 'node:crypto';
          const z=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(z.protocol!=='BANDALYTICS_COMPRESSION_ESCAPE_WATCH_V1'||z.point_in_time!==true||z.research_only!==true||z.scoring_enabled!==false||z.production_rule_changed!==false||z.auto_promote!==false)throw Error('unsafe compression escape watch');
          const {sha256,...body}=z,calc=crypto.createHash('sha256').update(JSON.stringify(body)).digest('hex');if(calc!==sha256)throw Error('compression escape watch sha mismatch');
          if(z.rows.some(r=>!r.locked_policy?.qualified))throw Error('non-qualified row in compression escape watch');
          if(z.rows.some(r=>r.evidence?.VALUE?.support!==null))throw Error('VALUE auto-confirmed in compression escape watch');
          console.log('V38_COMPRESSION_ESCAPE_WATCH_OK='+JSON.stringify({date:z.date,summary:z.summary}));
          NODE
      - name: Build unresolved execution draft template
        run: |
          set -euo pipefail
          F=$(find snapshots -type f -name 'v38-lock-readiness-*.json' | sort | tail -1)
          node scripts/build-v38-execution-draft-template.mjs "$F"
          T=$(find execution-draft-templates -type f -name '*.json' | sort | tail -1)
          node --input-type=module - "$T" <<'NODE'
          import fs from 'node:fs';const z=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(z.protocol!=='BANDALYTICS_EXECUTION_DRAFT_TEMPLATE_V1'||z.decision_state!=='UNRESOLVED'||z.point_in_time!==true||z.research_only!==true)throw Error('unsafe execution draft template');
          if(z.rows.some(r=>r.final_cut!==null||r.exposure_state!=='UNCLASSIFIED'||!Array.isArray(r.evidence_lanes)||r.evidence_lanes.length))throw Error('template must not make final-cut/exposure decisions');
          console.log('V38_EXECUTION_DRAFT_TEMPLATE_OK='+JSON.stringify({date:z.date,rows:z.rows.length,actionable:z.rows.filter(r=>r.eligible_for_final_cut).length}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v38-lock-readiness-${{ github.run_id }}
          path: |
            snapshots/v38-lock-readiness-*.json
            snapshots/v38-compression-escape-watch-*.json
            execution-draft-templates/*.json
          if-no-files-found: error
          retention-days: 90
