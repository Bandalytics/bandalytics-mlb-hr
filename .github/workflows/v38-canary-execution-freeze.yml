name: v38 Canary Execution + Settlement Contract
on:
  pull_request:
    paths:
      - 'scripts/freeze-v38-canary-execution.mjs'
      - 'scripts/capture-v38-manual-price-snapshot.mjs'
      - 'scripts/settle-v38-canary-execution.mjs'
      - 'test-v38-canary-execution-freeze.mjs'
      - 'test-v38-manual-price-fallback.mjs'
      - 'test-v38-canary-settlement.mjs'
      - '.github/workflows/v38-canary-execution-freeze.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/freeze-v38-canary-execution.mjs'
      - 'scripts/capture-v38-manual-price-snapshot.mjs'
      - 'scripts/settle-v38-canary-execution.mjs'
      - 'test-v38-canary-execution-freeze.mjs'
      - 'test-v38-manual-price-fallback.mjs'
      - 'test-v38-canary-settlement.mjs'
      - '.github/workflows/v38-canary-execution-freeze.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check scripts/freeze-v38-canary-execution.mjs
          node --check scripts/capture-v38-manual-price-snapshot.mjs
          node --check scripts/settle-v38-canary-execution.mjs
      - name: Canary freeze contract
        run: node test-v38-canary-execution-freeze.mjs
      - name: Manual price fallback contract
        run: node test-v38-manual-price-fallback.mjs
      - name: Canary settlement contract
        run: node test-v38-canary-settlement.mjs
