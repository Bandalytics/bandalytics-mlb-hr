name: Profile v38 Readiness
on:
  push:
    branches: [main]
    paths:
      - 'profile-v38-candidate.mjs'
      - 'profile-cutover-gate.mjs'
      - 'v38-profile-validity.mjs'
      - 'v38-gate-rules.mjs'
      - 'v38-context-selector.mjs'
      - 'v38-context-eval.mjs'
      - 'v38-pitchfit-bands.mjs'
      - 'v38-bbe-bands.mjs'
      - 'v38-baseball-convergence.mjs'
      - 'v38-modifier-artifacts.mjs'
      - 'v38-historical-profile-core.mjs'
      - 'mlb-hr-locked-policy.mjs'
      - 'v38-longshot-quality.mjs'
      - 'v38-longshot-promotion-gate.mjs'
      - 'api-handlers/profile-v38-candidate.js'
      - 'api-handlers/research-status.js'
      - 'scripts/capture-v38-pregame-snapshot.mjs'
      - 'scripts/evaluate-v38-pregame-snapshot.mjs'
      - 'scripts/analyze-v38-gate-combinations.mjs'
      - 'scripts/capture-v38-context-snapshot.mjs'
      - 'scripts/analyze-v38-pitchfit-slate.mjs'
      - 'scripts/analyze-v38-recent-bbe-slate.mjs'
      - 'test-profile-v38-candidate.mjs'
      - 'test-profile-v38-route.mjs'
      - 'test-profile-cutover-gate.mjs'
      - 'test-v38-pregame-snapshot-protocol.mjs'
      - 'test-v38-gate-rules.mjs'
      - 'test-v38-context-selector.mjs'
      - 'test-v38-context-eval.mjs'
      - 'test-v38-pitchfit-bands.mjs'
      - 'test-v38-bbe-bands.mjs'
      - 'test-v38-baseball-convergence.mjs'
      - 'test-v38-modifier-artifacts.mjs'
      - 'test-v38-historical-profile-core.mjs'
      - 'test-mlb-hr-locked-policy.mjs'
      - 'test-v38-longshot-quality.mjs'
      - 'test-v38-longshot-promotion-gate.mjs'
      - '.github/workflows/profile-v38-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test frozen v37 cutover gate
        run: node test-profile-cutover-gate.mjs
      - name: Test v38 candidate semantics
        run: node test-profile-v38-candidate.mjs
      - name: Test v38 route fail-closed contract
        run: node test-profile-v38-route.mjs
      - name: Test v38 prospective snapshot validity
        run: node test-v38-pregame-snapshot-protocol.mjs
      - name: Test v38 gate-rule invariants
        run: node test-v38-gate-rules.mjs
      - name: Test locked +700 longshot 4-of-6 policy
        run: node test-mlb-hr-locked-policy.mjs
      - name: Test research-only longshot quality tiers
        run: node test-v38-longshot-quality.mjs
      - name: Test fail-closed longshot promotion gate
        run: node test-v38-longshot-promotion-gate.mjs
      - name: Test latest-valid pregame context selection
        run: node test-v38-context-selector.mjs
      - name: Test constrained context convergence rules
        run: node test-v38-context-eval.mjs
      - name: Test TRUE-only slate-relative pitchfit bands
        run: node test-v38-pitchfit-bands.mjs
      - name: Test full-sample Recent BBE bands
        run: node test-v38-bbe-bands.mjs
      - name: Test pre-registered baseball convergence rules
        run: node test-v38-baseball-convergence.mjs
      - name: Test fail-closed modifier artifact joins
        run: node test-v38-modifier-artifacts.mjs
      - name: Test fail-closed historical v38 profile primitives
        run: node test-v38-historical-profile-core.mjs
      - name: Syntax-check postgame evaluator
        run: node --check scripts/evaluate-v38-pregame-snapshot.mjs
