name: Consolidate API for Vercel Hobby

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Consolidate API routes into one serverless function
        run: |
          set -e

          rm -rf api-handlers
          mv api api-handlers
          mkdir -p api

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const files = fs.readdirSync('api-handlers')
            .filter(f => f.endsWith('.js'))
            .sort();

          const imports = [];
          const entries = [];

          files.forEach((file, i) => {
            const name = file.replace(/\.js$/, '');
            const variable = `handler${i}`;
            imports.push(`import ${variable} from "../../api-handlers/${file}";`);
            entries.push(`  ${JSON.stringify(name)}: ${variable}`);
          });

          const router = `${imports.join('\n')}

          const handlers = {
          ${entries.join(',\n')}
          };

          export default async function handler(req, res) {
            const raw = req.query?.route;
            const parts = Array.isArray(raw) ? raw : [raw];
            const route = parts.filter(Boolean).join("/");

            if (!route || !handlers[route]) {
              return res.status(404).json({
                ok: false,
                error: "API_ROUTE_NOT_FOUND",
                route,
                available: Object.keys(handlers)
              });
            }

            try {
              return await handlers[route](req, res);
            } catch (error) {
              console.error("Bandalytics API router error:", route, error);
              if (!res.headersSent) {
                return res.status(500).json({
                  ok: false,
                  error: "API_ROUTE_FAILED",
                  route
                });
              }
            }
          }
          `;

          fs.writeFileSync('api/[...route].js', router);
          console.log(`Consolidated ${files.length} API handlers into api/[...route].js`);
          NODE

          echo "API functions remaining:"
          find api -type f -name '*.js' -print

      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate API routes for Vercel Hobby limit" || exit 0
          git push
