name: BANDALYTICS Home Screen Readiness
on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - 'pwa-inject.mjs'
      - 'test-pwa-home-screen.mjs'
      - 'package.json'
      - '.github/workflows/pwa-home-screen-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify multi-sport Home Screen contract
        run: node test-pwa-home-screen.mjs
      - name: Syntax-check PWA injector
        run: node --check pwa-inject.mjs
