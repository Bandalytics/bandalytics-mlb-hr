name: v38 Recent BBE Distribution
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze-v38-recent-bbe-slate.mjs'
      - '.github/workflows/v38-recent-bbe-distribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax preflight
        run: node --check scripts/analyze-v38-recent-bbe-slate.mjs
      - name: Analyze current-slate as-of Recent BBE distribution
        run: node scripts/analyze-v38-recent-bbe-slate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v38-recent-bbe-${{ github.run_id }}
          path: snapshots/v38-recent-bbe-*.json
          if-no-files-found: error
          retention-days: 30
