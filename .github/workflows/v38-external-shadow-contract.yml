name: v38 External Shadow Evidence Contract
on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-v38-external-shadow-snapshot.mjs'
      - 'test-v38-external-shadow-snapshot.mjs'
      - '.github/workflows/v38-external-shadow-contract.yml'
  pull_request:
    paths:
      - 'scripts/capture-v38-external-shadow-snapshot.mjs'
      - 'test-v38-external-shadow-snapshot.mjs'
      - '.github/workflows/v38-external-shadow-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check scripts/capture-v38-external-shadow-snapshot.mjs
          node test-v38-external-shadow-snapshot.mjs
