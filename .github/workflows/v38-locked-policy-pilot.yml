name: v38 Locked Policy Replay Pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v38-locked-policy-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        replay_date: ['2026-09-01','2026-09-02','2026-09-03']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run point-in-time replay
        run: node scripts/run-v38-point-in-time-replay.mjs "${{ matrix.replay_date }}"
      - name: Apply locked BANDALYTICS policy
        run: node scripts/evaluate-v38-locked-policy.mjs "snapshots/v38-point-in-time-replay-${{ matrix.replay_date }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v38-locked-policy-${{ matrix.replay_date }}-${{ github.run_id }}
          path: |
            snapshots/v38-point-in-time-replay-${{ matrix.replay_date }}.json
            snapshots/v38-point-in-time-replay-${{ matrix.replay_date }}-locked-policy.json
          if-no-files-found: error
          retention-days: 90
