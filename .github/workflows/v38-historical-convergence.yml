name: v38 Historical Convergence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v38-historical-convergence.yml'
      - 'scripts/evaluate-v38-historical-convergence.mjs'
      - 'scripts/analyze-v38-starter-damage-slate.mjs'
      - 'scripts/analyze-v38-bullpen-freshness-slate.mjs'
      - 'scripts/analyze-v38-lineup-position-slate.mjs'
      - 'scripts/analyze-v38-environment-slate.mjs'
      - 'scripts/analyze-v38-gascan-slate.mjs'
      - 'v38-stack-gascan-policy.mjs'
      - 'v38-baseball-convergence.mjs'
      - 'v38-pitchfit-bands.mjs'
      - 'v38-bbe-bands.mjs'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional YYYY-MM-DD; blank runs preregistered Aug 23-Sep 1 ten-slate window'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  convergence:
    strategy:
      fail-fast: false
      matrix:
        # Preregistered before reading Aug 23-25 outcomes: extend the existing
        # contiguous Aug 26-Sep 1 window backward by exactly three dates.
        # Do not drop/reorder dates based on outcomes.
        replay_date: ${{ inputs.date && fromJSON(format('["{0}"]', inputs.date)) || fromJSON('["2026-08-23","2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28","2026-08-29","2026-08-30","2026-08-31","2026-09-01"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax preflight
        run: |
          node --check scripts/run-v38-point-in-time-replay.mjs
          node --check scripts/analyze-v38-pitchfit-slate.mjs
          node --check scripts/analyze-v38-recent-bbe-slate.mjs
          node --check scripts/analyze-v38-starter-damage-slate.mjs
          node --check scripts/analyze-v38-bullpen-freshness-slate.mjs
          node --check scripts/analyze-v38-lineup-position-slate.mjs
          node --check scripts/analyze-v38-environment-slate.mjs
          node --check scripts/analyze-v38-gascan-slate.mjs
          node --check scripts/evaluate-v38-historical-convergence.mjs
      - name: Rebuild point-in-time profile
        run: node scripts/run-v38-point-in-time-replay.mjs "${{ matrix.replay_date }}"
      - name: Rebuild as-of pitch fit
        run: node scripts/analyze-v38-pitchfit-slate.mjs "${{ matrix.replay_date }}"
      - name: Rebuild as-of Recent BBE
        run: node scripts/analyze-v38-recent-bbe-slate.mjs "${{ matrix.replay_date }}"
      - name: Evaluate as-of starter damage
        run: node scripts/analyze-v38-starter-damage-slate.mjs "${{ matrix.replay_date }}" "snapshots/v38-point-in-time-replay-${{ matrix.replay_date }}.json"
      - name: Evaluate gas-can and same-team HR clustering
        run: node scripts/analyze-v38-gascan-slate.mjs "snapshots/v38-starter-damage-${{ matrix.replay_date }}.json"
      - name: Evaluate as-of bullpen freshness
        run: node scripts/analyze-v38-bullpen-freshness-slate.mjs "${{ matrix.replay_date }}" "snapshots/v38-point-in-time-replay-${{ matrix.replay_date }}.json"
      - name: Evaluate lineup position modifier
        run: node scripts/analyze-v38-lineup-position-slate.mjs "${{ matrix.replay_date }}" "snapshots/v38-point-in-time-replay-${{ matrix.replay_date }}.json"
      - name: Evaluate historical environment diagnostic
        run: node scripts/analyze-v38-environment-slate.mjs "${{ matrix.replay_date }}" "snapshots/v38-point-in-time-replay-${{ matrix.replay_date }}.json"
      - name: Evaluate frozen convergence registry
        run: node scripts/evaluate-v38-historical-convergence.mjs "snapshots/v38-point-in-time-replay-${{ matrix.replay_date }}.json" "snapshots/v38-pitchfit-${{ matrix.replay_date }}.json" "snapshots/v38-recent-bbe-${{ matrix.replay_date }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v38-historical-convergence-${{ matrix.replay_date }}-${{ github.run_id }}
          path: |
            snapshots/v38-point-in-time-replay-${{ matrix.replay_date }}.json
            snapshots/v38-pitchfit-${{ matrix.replay_date }}.json
            snapshots/v38-recent-bbe-${{ matrix.replay_date }}.json
            snapshots/v38-starter-damage-${{ matrix.replay_date }}.json
            snapshots/v38-gascan-team-cluster-${{ matrix.replay_date }}.json
            snapshots/v38-bullpen-freshness-${{ matrix.replay_date }}.json
            snapshots/v38-lineup-position-${{ matrix.replay_date }}.json
            snapshots/v38-environment-${{ matrix.replay_date }}.json
            snapshots/v38-historical-convergence-${{ matrix.replay_date }}.json
          if-no-files-found: error
          retention-days: 90
