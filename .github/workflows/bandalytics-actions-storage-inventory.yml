name: BANDALYTICS Actions storage inventory (no deletion)
on:
  push:
    paths:
      - .github/workflows/bandalytics-actions-storage-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read repository artifacts and report deletion candidates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import datetime,json,os,urllib.request
          repo=os.environ["REPOSITORY"]
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"],"X-GitHub-Api-Version":"2022-11-28"}
          results=[];page=1
          while True:
              url=f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}"
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as response:
                  data=json.load(response)
              items=data.get("artifacts",[])
              results.extend(items)
              if len(items)<100:break
              page+=1
              if page>100:raise RuntimeError("More than 10000 artifacts; audit incomplete")
          now=datetime.datetime.now(datetime.timezone.utc)
          def age(item):
              return (now-datetime.datetime.fromisoformat(item["created_at"].replace("Z","+00:00"))).days
          results.sort(key=lambda x:x.get("size_in_bytes",0),reverse=True)
          total=sum(x.get("size_in_bytes",0) for x in results)
          print("ACTIONS_ARTIFACT_INVENTORY",json.dumps({"repository":repo,"count":len(results),"bytes":total,"mb":round(total/1024**2,2),"pages":page}))
          lines=["# BANDALYTICS Actions artifact inventory",f"Repository: {repo}",f"Artifacts: {len(results)}; bytes: {total}; MiB: {total/1024**2:.2f}","No artifacts were deleted.","","| Artifact ID | Name | Age (days) | MiB |","|---:|---|---:|---:|"]
          for item in results[:100]:
              entry={"id":item["id"],"name":item["name"],"size_bytes":item["size_in_bytes"],"age_days":age(item),"expired":item.get("expired"),"workflow_run":item.get("workflow_run",{}).get("id")}
              print("ARTIFACT_ROW",json.dumps(entry))
              lines.append(f"| {entry['id']} | {entry['name'].replace('|','/')} | {entry['age_days']} | {entry['size_bytes']/1024**2:.2f} |")
          if len(results)>100:lines.append(f"...plus {len(results)-100} further artifacts not shown in summary table; full count/sum above.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("\n".join(lines)+"\n")
