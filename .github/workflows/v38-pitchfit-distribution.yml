name: v38 Pitchfit Distribution
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze-v38-pitchfit-slate.mjs'
      - '.github/workflows/v38-pitchfit-distribution.yml'
  schedule:
    - cron: '30 16,19,21,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax preflight
        run: node --check scripts/analyze-v38-pitchfit-slate.mjs
      - name: Analyze current-slate as-of pitchfit distribution
        run: node scripts/analyze-v38-pitchfit-slate.mjs
      - name: Verify fail-closed PitchFit contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find snapshots -type f -name 'v38-pitchfit-*.json' | sort | tail -1)
          python3 - "$FILE" <<'PY'
          import json,sys
          z=json.load(open(sys.argv[1]))
          assert z['protocol']=='V38_PITCHFIT_DISTRIBUTION_V1'
          assert z['capture_mode']=='AS_OF_RECONSTRUCTABLE'
          assert z['research_only'] is True
          assert z['scoring_enabled'] is False
          assert z['scoring_eligible'] is False
          assert z['model_scoring_changed'] is False
          assert z['as_of_verified'] is True
          assert isinstance(z['pregame_game_pks'],list)
          assert isinstance(z['rows'],list)
          assert z['fit_rows']==len(z['rows'])
          assert z['true_rows']+z['partial_rows']+z['pending_rows']+z['error_rows'] <= z['fit_rows']
          if z['prospective_pregame_only']:
            assert all(isinstance(x,int) for x in z['pregame_game_pks'])
          print('V38_PITCHFIT_CONTRACT_OK',{'date':z['date'],'pregame_games':len(z['pregame_game_pks']),'fit_rows':z['fit_rows'],'true_rows':z['true_rows'],'error_rows':z['error_rows']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v38-pitchfit-${{ github.run_id }}
          path: snapshots/v38-pitchfit-*.json
          if-no-files-found: error
          retention-days: 30
