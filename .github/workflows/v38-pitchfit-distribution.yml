name: v38 Pitchfit Distribution
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze-v38-pitchfit-slate.mjs'
      - '.github/workflows/v38-pitchfit-distribution.yml'
  schedule:
    - cron: '30 16,19,21,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax preflight
        run: node --check scripts/analyze-v38-pitchfit-slate.mjs
      - name: Analyze current-slate as-of pitchfit distribution
        run: node scripts/analyze-v38-pitchfit-slate.mjs
      - name: Verify fail-closed PitchFit contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find snapshots -type f -name 'v38-pitchfit-*.json' | sort | tail -1)
          node - "$FILE" <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const z=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(z.protocol!=='V38_PITCHFIT_DISTRIBUTION_V1')throw Error('protocol');
          if(z.capture_mode!=='AS_OF_RECONSTRUCTABLE'||z.research_only!==true||z.scoring_enabled!==false||z.scoring_eligible!==false||z.model_scoring_changed!==false||z.as_of_verified!==true)throw Error('flags');
          if(!Array.isArray(z.pregame_game_pks)||!Array.isArray(z.rows)||z.fit_rows!==z.rows.length)throw Error('shape');
          if(z.true_rows+z.partial_rows+z.pending_rows+z.error_rows>z.fit_rows)throw Error('counts');
          if(z.prospective_pregame_only&&!z.pregame_game_pks.every(Number.isInteger))throw Error('game pks');
          if(typeof z.sha256!=='string'||!/^[a-f0-9]{64}$/.test(z.sha256))throw Error('sha format');
          const expected=z.sha256,{sha256,...body}=z,calc=crypto.createHash('sha256').update(JSON.stringify(body)).digest('hex');
          if(calc!==expected)throw Error(`sha mismatch ${calc} != ${expected}`);
          console.log('V38_PITCHFIT_CONTRACT_OK',JSON.stringify({date:z.date,pregame_games:z.pregame_game_pks.length,fit_rows:z.fit_rows,true_rows:z.true_rows,error_rows:z.error_rows,sha256:expected}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v38-pitchfit-${{ github.run_id }}
          path: snapshots/v38-pitchfit-*.json
          if-no-files-found: error
          retention-days: 30
