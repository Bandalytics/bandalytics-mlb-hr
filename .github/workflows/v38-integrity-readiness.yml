name: v38 Integrity Readiness
on:
  push:
    branches: [main]
    paths:
      - 'api-handlers/research-board.js'
      - 'api-handlers/research-status.js'
      - 'direct-research-ui.js'
      - 'native-feed-core.mjs'
      - 'mlb-hr-locked-policy.mjs'
      - 'v38-park-factor-policy.mjs'
      - 'v38-park-prospective-policy.mjs'
      - 'v38-evidence-manifest.mjs'
      - 'v38-selected-pool-report.mjs'
      - 'v38-stack-gascan-policy.mjs'
      - 'v38-prospective-escape-watch.mjs'
      - 'v38-environment-parity-core.mjs'
      - 'v38-environment-parity-gate.mjs'
      - 'v38-context-selector.mjs'
      - 'v38-profile-snapshot-selector.mjs'
      - 'v38-modifier-artifacts.mjs'
      - 'v38-pool-architecture-v2.mjs'
      - 'v38-pool-shortlist-v2.mjs'
      - 'v38-pool-shortlist-v3.mjs'
      - 'scripts/augment-v38-selected-pool-report.mjs'
      - 'scripts/evaluate-v38-pregame-snapshot.mjs'
      - 'scripts/analyze-v38-gascan-slate.mjs'
      - 'scripts/analyze-v38-historical-escape-audit.mjs'
      - 'scripts/summarize-v38-historical-promotion-evidence.mjs'
      - 'scripts/evaluate-v38-prospective-escape-watch.mjs'
      - 'scripts/evaluate-v38-environment-parity-window.mjs'
      - 'scripts/evaluate-v38-park-prospective.mjs'
      - 'test-native-feed.mjs'
      - 'test-direct-research-ui.mjs'
      - 'test-v38-research-board.mjs'
      - 'test-mlb-hr-locked-policy.mjs'
      - 'test-v38-park-factor-policy.mjs'
      - 'test-v38-park-prospective-policy.mjs'
      - 'test-v38-evidence-manifest.mjs'
      - 'test-v38-selected-pool-report.mjs'
      - 'test-v38-stack-gascan-policy.mjs'
      - 'test-v38-prospective-escape-watch.mjs'
      - 'test-v38-environment-parity.mjs'
      - 'test-v38-context-selector.mjs'
      - 'test-v38-profile-snapshot-selector.mjs'
      - 'test-v38-modifier-artifacts.mjs'
      - 'test-v38-pool-architecture-v2.mjs'
      - 'test-v38-pool-shortlist-v2.mjs'
      - 'test-v38-pool-shortlist-v3.mjs'
      - 'test-v38-pool-queue-caps.mjs'
      - '.github/workflows/v38-integrity-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test native feed identity and batter handedness
        run: node test-native-feed.mjs
      - name: Test locked +700 policy
        run: node test-mlb-hr-locked-policy.mjs
      - name: Test research-board policy contract
        run: node test-v38-research-board.mjs
      - name: Test Direct Lab automated-board safety contract
        run: node test-direct-research-ui.mjs
      - name: Test point-in-time park-factor policy
        run: node test-v38-park-factor-policy.mjs
      - name: Test prospective park-factor validation policy
        run: node test-v38-park-prospective-policy.mjs
      - name: Test immutable evidence manifest
        run: node test-v38-evidence-manifest.mjs
      - name: Test selected-pool HR and market-return reporting
        run: node test-v38-selected-pool-report.mjs
      - name: Test stack and gas-can research guardrails
        run: node test-v38-stack-gascan-policy.mjs
      - name: Test future-only escape-watch contract
        run: node test-v38-prospective-escape-watch.mjs
      - name: Test environment parity and wind normalization
        run: node test-v38-environment-parity.mjs
      - name: Test latest pregame context selection
        run: node test-v38-context-selector.mjs
      - name: Test pregame profile snapshot hash selection
        run: node test-v38-profile-snapshot-selector.mjs
      - name: Test modifier artifact hash and tamper rejection
        run: node test-v38-modifier-artifacts.mjs
      - name: Test layered pool architecture
        run: node test-v38-pool-architecture-v2.mjs
      - name: Test layered pool evidence readiness legacy
        run: node test-v38-pool-shortlist-v2.mjs
      - name: Test slate-sized non-forced review ceilings
        run: node test-v38-pool-shortlist-v3.mjs
      - name: Test layered review queue cumulative caps legacy
        run: node test-v38-pool-queue-caps.mjs
      - name: Syntax-check gas-can historical analyzer
        run: node --check scripts/analyze-v38-gascan-slate.mjs
      - name: Syntax-check historical escape audit
        run: node --check scripts/analyze-v38-historical-escape-audit.mjs
      - name: Syntax-check historical promotion evidence
        run: node --check scripts/summarize-v38-historical-promotion-evidence.mjs
      - name: Syntax-check future escape-watch evaluator
        run: node --check scripts/evaluate-v38-prospective-escape-watch.mjs
      - name: Syntax-check environment parity window evaluator
        run: node --check scripts/evaluate-v38-environment-parity-window.mjs
      - name: Syntax-check prospective park evaluator
        run: node --check scripts/evaluate-v38-park-prospective.mjs
      - name: Syntax-check V5 prospective evaluator
        run: node --check scripts/evaluate-v38-pregame-snapshot.mjs
      - name: Syntax-check V5 report + manifest augmentation
        run: node --check scripts/augment-v38-selected-pool-report.mjs
