name: v38 Postgame Evaluation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/evaluate-v38-pregame-snapshot.mjs'
      - 'scripts/augment-v38-selected-pool-report.mjs'
      - 'v38-selected-pool-report.mjs'
      - 'v38-evidence-manifest.mjs'
      - 'v38-prospective-modifier-selector.mjs'
      - 'v38-modifier-artifacts.mjs'
      - '.github/workflows/v38-postgame-evaluation.yml'
  schedule:
    - cron: '0 6,8,10 * * *'
  workflow_dispatch:
    inputs:
      evaluation_date:
        description: 'Optional YYYY-MM-DD slate date; defaults to prior ET date'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Find successful pregame snapshot
        id: find
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DATE='${{ github.event.inputs.evaluation_date || '' }}'
          if [[ -n "$INPUT_DATE" ]]; then
            if [[ ! "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "Invalid evaluation_date: $INPUT_DATE"; exit 3; fi
            DATE="$INPUT_DATE"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            DATE=$(TZ=America/New_York date +%F)
          else
            DATE=$(TZ=America/New_York date -d 'yesterday' +%F)
          fi
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          RUN_ID=$(gh api "repos/${GH_REPO}/actions/workflows/v38-pregame-snapshot.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" | head -1 || true)
          if [ -z "${RUN_ID:-}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No successful v38 pregame snapshot for ${DATE}; nothing to evaluate."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          mkdir -p incoming/profile incoming/contexts incoming/modifiers
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "v38-pregame-${RUN_ID}" --dir incoming/profile
          SNAP=$(find incoming/profile -type f -name 'v38-pregame-*.json' | head -1)
          if [ -z "${SNAP:-}" ]; then echo "Snapshot artifact exists but JSON is missing"; exit 4; fi
          echo "snapshot=${SNAP}" >> "$GITHUB_OUTPUT"
      - name: Download all same-day context snapshots
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.find.outputs.date }}"
          mapfile -t IDS < <(gh api "repos/${GH_REPO}/actions/workflows/v38-context-snapshot.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          for ID in "${IDS[@]:-}"; do
            [ -n "$ID" ] || continue
            mkdir -p "incoming/contexts/$ID"
            gh run download "$ID" --repo "$GH_REPO" --name "v38-context-${ID}" --dir "incoming/contexts/$ID" || true
          done
          echo "Downloaded $(find incoming/contexts -type f -name 'v38-context-*.json' | wc -l) context snapshots for ${DATE}."
      - name: Download all same-day pitchfit and Recent BBE snapshots
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.find.outputs.date }}"
          mapfile -t PF_IDS < <(gh api "repos/${GH_REPO}/actions/workflows/v38-pitchfit-distribution.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          mapfile -t BB_IDS < <(gh api "repos/${GH_REPO}/actions/workflows/v38-recent-bbe-distribution.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          for ID in "${PF_IDS[@]:-}"; do
            [ -n "$ID" ] || continue
            mkdir -p "incoming/modifiers/pitchfit/$ID"
            gh run download "$ID" --repo "$GH_REPO" --name "v38-pitchfit-${ID}" --dir "incoming/modifiers/pitchfit/$ID" || true
          done
          for ID in "${BB_IDS[@]:-}"; do
            [ -n "$ID" ] || continue
            mkdir -p "incoming/modifiers/bbe/$ID"
            gh run download "$ID" --repo "$GH_REPO" --name "v38-recent-bbe-${ID}" --dir "incoming/modifiers/bbe/$ID" || true
          done
          echo "Pitchfit snapshots: $(find incoming/modifiers -type f -name 'v38-pitchfit-*.json' | wc -l)"
          echo "Recent BBE snapshots: $(find incoming/modifiers -type f -name 'v38-recent-bbe-*.json' | wc -l)"
      - name: Evaluate only after every eligible game is final
        id: eval
        if: steps.find.outputs.found == 'true'
        shell: bash
        run: |
          set +e
          node scripts/evaluate-v38-pregame-snapshot.mjs "${{ steps.find.outputs.snapshot }}" incoming/contexts incoming/modifiers
          RC=$?
          set -e
          if [ "$RC" -eq 2 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Eligible slate is not fully final yet; prospective evaluation deferred."
            exit 0
          fi
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Add selected-pool report and immutable evidence manifest
        if: steps.eval.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EVAL=$(find incoming/profile -type f -name '*-evaluated.json' | head -1)
          node scripts/augment-v38-selected-pool-report.mjs "$EVAL" incoming/contexts incoming/modifiers
      - name: Verify V5 qualifying prospective contract
        if: steps.eval.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EVAL=$(find incoming/profile -type f -name '*-evaluated.json' | head -1)
          python3 - "$EVAL" <<'PY'
          import json,sys
          z=json.load(open(sys.argv[1]))
          assert z['evaluation_protocol']=='V38_PREGAME_OUTCOME_EVAL_V5'
          assert z['point_in_time'] is True
          assert z['qualifying_backtest'] is True
          assert z['prospective_validation'] is True
          assert z['status']=='FINAL'
          assert z['research_only'] is True
          assert z['scoring_enabled'] is False
          assert z['scoring_eligible'] is False
          assert z['model_scoring_changed'] is False
          assert z['final_games']==z['eligible_games']
          assert z['modifier_selection_rule']=='latest valid artifact strictly before each game start and containing that game'
          assert isinstance(z['candidate_rule_results'],list)
          assert isinstance(z['context_convergence_results'],list)
          assert isinstance(z['baseball_convergence_results'],list)
          assert isinstance(z['modifier_coverage'],dict)
          assert isinstance(z['selected_pool_report'],dict)
          assert z['selected_pool_report']['protocol']=='V38_SELECTED_POOL_REPORT_V1'
          assert z['selected_pool_report']['scoring_enabled'] is False
          assert z['selected_pool_report']['pool_target_role']=='TARGET_ONLY_NOT_FORCED'
          m=z['evidence_manifest']
          assert m['protocol']=='V38_EVIDENCE_MANIFEST_V1'
          assert m['immutable'] is True and m['point_in_time'] is True
          assert m['research_only'] is True and m['scoring_enabled'] is False and m['scoring_eligible'] is False
          assert m['pullair_threshold_deg']==15.5
          assert isinstance(m['rule_fingerprint'],str) and len(m['rule_fingerprint'])==64
          assert isinstance(m['artifact_fingerprint'],str) and len(m['artifact_fingerprint'])==64
          assert isinstance(m['manifest_digest'],str) and len(m['manifest_digest'])==64
          assert len(m['artifacts'])>=1
          assert z['context_coverage']['snapshots_loaded'] >= 0
          assert z['modifier_coverage']['pitchfit_artifacts_loaded'] >= 0
          assert z['modifier_coverage']['bbe_artifacts_loaded'] >= 0
          for r in z.get('rows',[]):
            ev=r.get('modifier_evidence') or {}
            if ev.get('pitchfit_captured_at'):
              assert ev.get('per_game_strictly_pregame') is True
            if ev.get('bbe_captured_at'):
              assert ev.get('per_game_strictly_pregame') is True
          print('V38_PROSPECTIVE_FINAL='+json.dumps({k:z[k] for k in ['evaluation_protocol','date','eligible_games','played_profiled_hitters','unique_hr_hitters','base_hr_rate','context_coverage','modifier_coverage','candidate_rule_results','context_convergence_results','baseball_convergence_results','selected_pool_report','evidence_manifest']}))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.eval.outputs.ready == 'true'
        with:
          name: v38-postgame-${{ steps.find.outputs.date }}-${{ github.run_id }}
          path: incoming/profile/*-evaluated.json
          if-no-files-found: error
          retention-days: 90
