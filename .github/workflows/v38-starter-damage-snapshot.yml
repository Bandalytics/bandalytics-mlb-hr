name: v38 Starter Damage Snapshot
on:
  pull_request:
    paths:
      - 'scripts/capture-v38-starter-damage-snapshot.mjs'
      - 'starter-native-core.mjs'
      - 'native-feed-core.mjs'
      - '.github/workflows/v38-starter-damage-snapshot.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/capture-v38-starter-damage-snapshot.mjs'
      - 'starter-native-core.mjs'
      - 'native-feed-core.mjs'
      - '.github/workflows/v38-starter-damage-snapshot.yml'
  schedule:
    - cron: '25 16,19,21,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve current ET slate
        id: date
        run: echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Syntax
        run: node --check scripts/capture-v38-starter-damage-snapshot.mjs
      - name: Capture immutable starter damage snapshot
        run: node scripts/capture-v38-starter-damage-snapshot.mjs '${{ steps.date.outputs.date }}'
      - name: Verify snapshot contract
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const p=fs.readdirSync('snapshots').find(x=>x.startsWith('v38-starter-damage-snapshot-'));
          const z=JSON.parse(fs.readFileSync(`snapshots/${p}`,'utf8'));
          if(z.protocol!=='V38_STARTER_DAMAGE_SNAPSHOT_V1'||z.point_in_time!==true||z.as_of_verified!==true||z.research_only!==true||z.scoring_enabled!==false||z.scoring_eligible!==false) throw Error('bad starter snapshot flags');
          const {sha256,...body}=z; if(!/^[a-f0-9]{64}$/.test(sha256)||crypto.createHash('sha256').update(JSON.stringify(body)).digest('hex')!==sha256) throw Error('starter snapshot sha mismatch');
          const bands=new Set(['LOW_LT_1_2','MID_1_2_TO_1_5','HIGH_GE_1_5','SMALL_SAMPLE','UNAVAILABLE']);
          for(const r of z.rows||[]) if(!bands.has(r.starter_hr9_band)) throw Error('bad starter band');
          console.log('V38_STARTER_DAMAGE_SNAPSHOT_OK='+JSON.stringify({date:z.date,captured_at:z.captured_at,rows:(z.rows||[]).length,pitchers:z.pitchers,fetch_error:z.fetch_error}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v38-starter-damage-${{ github.run_id }}
          path: snapshots/v38-starter-damage-snapshot-*.json
          if-no-files-found: error
          retention-days: 30
