name: v38 Slate Decision Bundle Contract
on:
  push:
    paths:
      - 'scripts/freeze-v38-slate-decision-bundle.mjs'
      - 'scripts/hydrate-v38-execution-draft.mjs'
      - 'test-v38-slate-decision-bundle.mjs'
      - 'test-v38-prospective-slate-lock-workflow.mjs'
      - 'test-v38-execution-draft-hydrator.mjs'
      - 'test-v38-prospective-postslate-workflow.mjs'
      - '.github/workflows/v38-prospective-slate-lock.yml'
      - '.github/workflows/v38-prospective-postslate-audit.yml'
      - 'package.json'
      - '.github/workflows/v38-slate-decision-bundle-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check scripts/freeze-v38-slate-decision-bundle.mjs
          node --check scripts/hydrate-v38-execution-draft.mjs
      - name: Decision bundle contract
        run: node test-v38-slate-decision-bundle.mjs
      - name: Execution draft hydrator contract
        run: node test-v38-execution-draft-hydrator.mjs
      - name: Prospective slate lock workflow contract
        run: node test-v38-prospective-slate-lock-workflow.mjs
      - name: Prospective post-slate workflow contract
        run: node test-v38-prospective-postslate-workflow.mjs
