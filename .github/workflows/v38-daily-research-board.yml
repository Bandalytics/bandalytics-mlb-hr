name: v38 Daily Research Board
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-v38-daily-research-board.mjs'
      - '.github/workflows/v38-daily-research-board.yml'
  schedule:
    - cron: '45 16,19,21,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax preflight
        run: node --check scripts/build-v38-daily-research-board.mjs
      - name: Resolve current ET slate
        id: date
        run: echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Download latest same-day profile snapshot
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.date.outputs.date }}'
          mkdir -p incoming/profile incoming/contexts incoming/modifiers/pitchfit incoming/modifiers/bbe snapshots
          RUN_ID=$(gh api "repos/${GH_REPO}/actions/workflows/v38-pregame-snapshot.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" | head -1 || true)
          if [ -z "${RUN_ID:-}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No valid profile snapshot for ${DATE}; board generation skipped."
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "v38-pregame-${RUN_ID}" --dir incoming/profile
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Download all same-day context and modifier snapshots
        if: steps.profile.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.date.outputs.date }}'
          mapfile -t CTX < <(gh api "repos/${GH_REPO}/actions/workflows/v38-context-snapshot.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          for ID in "${CTX[@]:-}"; do
            [ -n "$ID" ] || continue
            mkdir -p "incoming/contexts/$ID"
            gh run download "$ID" --repo "$GH_REPO" --name "v38-context-${ID}" --dir "incoming/contexts/$ID" || true
          done
          mapfile -t PF < <(gh api "repos/${GH_REPO}/actions/workflows/v38-pitchfit-distribution.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          for ID in "${PF[@]:-}"; do
            [ -n "$ID" ] || continue
            mkdir -p "incoming/modifiers/pitchfit/$ID"
            gh run download "$ID" --repo "$GH_REPO" --name "v38-pitchfit-${ID}" --dir "incoming/modifiers/pitchfit/$ID" || true
          done
          mapfile -t BB < <(gh api "repos/${GH_REPO}/actions/workflows/v38-recent-bbe-distribution.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          for ID in "${BB[@]:-}"; do
            [ -n "$ID" ] || continue
            mkdir -p "incoming/modifiers/bbe/$ID"
            gh run download "$ID" --repo "$GH_REPO" --name "v38-recent-bbe-${ID}" --dir "incoming/modifiers/bbe/$ID" || true
          done
          echo "Contexts: $(find incoming/contexts -type f -name '*.json' | wc -l)"
          echo "Pitchfit: $(find incoming/modifiers/pitchfit -type f -name '*.json' | wc -l)"
          echo "BBE: $(find incoming/modifiers/bbe -type f -name '*.json' | wc -l)"
      - name: Build first-party research board
        if: steps.profile.outputs.found == 'true'
        run: node scripts/build-v38-daily-research-board.mjs incoming/profile incoming/contexts incoming/modifiers snapshots/v38-daily-research-board-${{ steps.date.outputs.date }}.json
      - name: Verify research-only contract
        if: steps.profile.outputs.found == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json
          p=glob.glob('snapshots/v38-daily-research-board-*.json')[0]
          z=json.load(open(p))
          assert z['protocol']=='V38_DAILY_RESEARCH_BOARD_V1'
          assert z['point_in_time'] is True
          assert z['research_only'] is True
          assert z['scoring_enabled'] is False
          assert z['scoring_eligible'] is False
          assert z['pool_target_role']=='TARGET_ONLY_NOT_FORCED'
          assert z['vig_required'] is False
          print('V38_DAILY_BOARD='+json.dumps({'date':z['date'],'coverage':z['coverage'],'counts':z['counts']}))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.profile.outputs.found == 'true'
        with:
          name: v38-daily-research-board-${{ steps.date.outputs.date }}-${{ github.run_id }}
          path: snapshots/v38-daily-research-board-*.json
          if-no-files-found: error
          retention-days: 30
