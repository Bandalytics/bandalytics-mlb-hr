name: v38 Daily Research Board
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-v38-daily-research-board.mjs'
      - 'v38-profile-snapshot-selector.mjs'
      - 'v38-context-selector.mjs'
      - 'v38-modifier-artifacts.mjs'
      - 'v38-prospective-modifier-selector.mjs'
      - 'test-v38-modifier-artifacts.mjs'
      - 'v38-park-factor-policy.mjs'
      - 'v38-pool-shortlist-v3.mjs'
      - 'test-v38-pool-shortlist-v3.mjs'
      - '.github/workflows/v38-daily-research-board.yml'
  schedule:
    - cron: '45 16,19,21,23 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax preflight
        run: |
          node --check scripts/build-v38-daily-research-board.mjs
          node --check v38-profile-snapshot-selector.mjs
          node --check v38-context-selector.mjs
          node test-v38-modifier-artifacts.mjs
          node test-v38-pool-shortlist-v3.mjs
      - name: Resolve current ET slate
        id: date
        run: echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Download latest same-day profile snapshot
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.date.outputs.date }}'
          mkdir -p incoming/profile incoming/contexts incoming/modifiers/pitchfit incoming/modifiers/bbe incoming/park snapshots
          mapfile -t RUN_IDS < <(gh api "repos/${GH_REPO}/actions/workflows/v38-pregame-snapshot.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          if [ "${#RUN_IDS[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No successful profile snapshot candidates for ${DATE}; board generation skipped."
            exit 0
          fi
          for ID in "${RUN_IDS[@]}"; do
            [ -n "$ID" ] || continue
            mkdir -p "incoming/profile/$ID"
            gh run download "$ID" --repo "$GH_REPO" --name "v38-pregame-${ID}" --dir "incoming/profile/$ID" || true
          done
          if [ "$(find incoming/profile -type f -name 'v38-pregame-*.json' | wc -l)" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No downloadable profile snapshot candidates for ${DATE}; board generation skipped."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Download all same-day context, modifier, and park snapshots
        if: steps.profile.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.date.outputs.date }}'
          mapfile -t CTX < <(gh api "repos/${GH_REPO}/actions/workflows/v38-context-snapshot.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          for ID in "${CTX[@]:-}"; do [ -n "$ID" ] || continue; mkdir -p "incoming/contexts/$ID"; gh run download "$ID" --repo "$GH_REPO" --name "v38-context-${ID}" --dir "incoming/contexts/$ID" || true; done
          mapfile -t PF < <(gh api "repos/${GH_REPO}/actions/workflows/v38-pitchfit-distribution.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          for ID in "${PF[@]:-}"; do [ -n "$ID" ] || continue; mkdir -p "incoming/modifiers/pitchfit/$ID"; gh run download "$ID" --repo "$GH_REPO" --name "v38-pitchfit-${ID}" --dir "incoming/modifiers/pitchfit/$ID" || true; done
          mapfile -t BB < <(gh api "repos/${GH_REPO}/actions/workflows/v38-recent-bbe-distribution.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          for ID in "${BB[@]:-}"; do [ -n "$ID" ] || continue; mkdir -p "incoming/modifiers/bbe/$ID"; gh run download "$ID" --repo "$GH_REPO" --name "v38-recent-bbe-${ID}" --dir "incoming/modifiers/bbe/$ID" || true; done
          mapfile -t PARK < <(gh api "repos/${GH_REPO}/actions/workflows/v38-park-factor-snapshot.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select(.created_at | startswith(\"${DATE}\")) | .id" || true)
          for ID in "${PARK[@]:-}"; do [ -n "$ID" ] || continue; mkdir -p "incoming/park/$ID"; gh run download "$ID" --repo "$GH_REPO" --name "v38-park-factors-${ID}" --dir "incoming/park/$ID" || true; done
          echo "Contexts: $(find incoming/contexts -type f -name '*.json' | wc -l)"
          echo "Pitchfit: $(find incoming/modifiers/pitchfit -type f -name '*.json' | wc -l)"
          echo "BBE: $(find incoming/modifiers/bbe -type f -name '*.json' | wc -l)"
          echo "Park: $(find incoming/park -type f -name '*.json' | wc -l)"
      - name: Build first-party research board
        if: steps.profile.outputs.found == 'true'
        run: node scripts/build-v38-daily-research-board.mjs incoming/profile incoming/contexts incoming/modifiers snapshots/v38-daily-research-board-${{ steps.date.outputs.date }}.json incoming/park
      - name: Verify research-only contract
        if: steps.profile.outputs.found == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,re
          p=glob.glob('snapshots/v38-daily-research-board-*.json')[0]
          z=json.load(open(p))
          assert z['protocol']=='V38_DAILY_RESEARCH_BOARD_V2'
          assert z['point_in_time'] is True
          assert z['research_only'] is True
          assert z['scoring_enabled'] is False
          assert z['scoring_eligible'] is False
          assert z['pool_target_role']=='PREFERRED_RANGE_NOT_REQUIRED'
          assert z['pool_target']==[20,25]
          assert z['pool_target_forced'] is False
          pa=z['pool_architecture']
          assert pa['shortlist_protocol']=='V38_POOL_SHORTLIST_V3'
          assert pa['first_prospective_date']=='2026-09-04'
          assert pa['slate_size_source']=='VERIFIED_PROFILE_PREGAME_PLUS_EXCLUDED_STARTED_UNIQUE_GAMEPK'
          assert pa['no_minimum'] is True
          assert pa['production_rule_changed'] is False
          games=pa['original_slate_game_count']; ceiling=pa['dynamic_review_ceiling']
          assert isinstance(games,int) and games>=1
          assert ceiling==(20 if games<=8 else 25 if games<=12 else 30)
          assert z['vig_required'] is False
          assert re.fullmatch(r'[a-f0-9]{64}',z.get('source_profile_snapshot_sha256') or '')
          assert isinstance(z['coverage']['park_snapshots_loaded'], int)
          assert z['coverage']['rows_with_park_factor'] >= 0
          for r in z.get('rows',[]):
            if r.get('context_captured_at'):
              assert re.fullmatch(r'[a-f0-9]{64}',r.get('context_snapshot_sha256') or '')
              assert r['context_captured_at'] < r['start_time']
            else:
              assert r.get('context_snapshot_sha256') is None
            me=r.get('modifier_evidence') or {}
            if r.get('pitchfit') is not None:
              assert me.get('pitchfit_cryptographically_verified') is True
              assert re.fullmatch(r'[a-f0-9]{64}',me.get('pitchfit_snapshot_sha256') or '')
              assert me.get('pitchfit_captured_at') < r['start_time']
              assert int(r['pitchfit'].get('gamePk'))==int(r['gamePk'])
            if r.get('bbe') is not None:
              assert me.get('bbe_cryptographically_verified') is True
              assert re.fullmatch(r'[a-f0-9]{64}',me.get('bbe_snapshot_sha256') or '')
              assert me.get('bbe_captured_at') < r['start_time']
              assert int(r['bbe'].get('gamePk'))==int(r['gamePk'])
            if r.get('pitchfit') is None and r.get('bbe') is None:
              assert me.get('cryptographically_verified') is False
            pf=r.get('park_factor')
            if pf:
              assert r.get('effective_bat_side') in ('L','R')
              assert pf['bat_side']==r['effective_bat_side']
              assert pf['research_only'] is True
              assert pf['scoring_enabled'] is False
              assert pf['standalone_hr_boost'] is False
              assert r['park_factor_captured_at'] < r['start_time']
          print('V38_DAILY_BOARD='+json.dumps({'date':z['date'],'pool_architecture':pa,'coverage':z['coverage'],'counts':z['counts']}))
          PY
      - uses: actions/upload-artifact@v4
        if: steps.profile.outputs.found == 'true'
        with:
          name: v38-daily-research-board-${{ steps.date.outputs.date }}-${{ github.run_id }}
          path: snapshots/v38-daily-research-board-*.json
          if-no-files-found: error
          retention-days: 30
