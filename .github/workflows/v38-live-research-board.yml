name: v38 Live Research Board
on:
  schedule:
    - cron: '45 16,17,19,21,23 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['v38 Pregame Snapshot','v38 Context Snapshot','v38 Park Factor Snapshot','v38 Pitchfit Distribution','v38 Recent BBE Distribution']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/build-v38-live-research-board.mjs'
      - 'v38-profile-snapshot-selector.mjs'
      - 'v38-research-pool-hierarchy.mjs'
      - 'v38-pool-architecture-v2.mjs'
      - 'test-v38-pool-architecture-v2.mjs'
      - 'v38-pool-shortlist-v3.mjs'
      - 'test-v38-pool-shortlist-v3.mjs'
      - 'v38-longshot-quality.mjs'
      - 'v38-prospective-modifier-selector.mjs'
      - 'v38-modifier-artifacts.mjs'
      - 'v38-context-selector.mjs'
      - 'v38-park-factor-policy.mjs'
      - '.github/workflows/v38-live-research-board.yml'
permissions:
  contents: read
  actions: read
jobs:
  board:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax preflight
        run: |
          node --check scripts/build-v38-live-research-board.mjs
          node --check v38-profile-snapshot-selector.mjs
          node --check v38-context-selector.mjs
          node test-v38-pool-architecture-v2.mjs
          node test-v38-pool-shortlist-v3.mjs
          node test-v38-park-factor-policy.mjs
      - name: Download latest valid daily research evidence
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(TZ=America/New_York date +%F)
          NEXT_UTC_DATE=$(date -u -d "$DATE +1 day" +%F)
          mkdir -p incoming/profile incoming/contexts incoming/modifiers/pitchfit incoming/modifiers/bbe incoming/park
          mapfile -t PROFILE_IDS < <(gh api "repos/${GH_REPO}/actions/workflows/v38-pregame-snapshot.yml/runs?status=success&per_page=30" --jq ".workflow_runs[] | select((.created_at|startswith(\"${DATE}\")) or (.created_at|startswith(\"${NEXT_UTC_DATE}\"))) | .id" || true)
          for ID in "${PROFILE_IDS[@]:-}"; do [ -n "$ID" ] || continue; mkdir -p "incoming/profile/$ID"; gh run download "$ID" --repo "$GH_REPO" --name "v38-pregame-${ID}" --dir "incoming/profile/$ID" || true; done
          if [ "$(find incoming/profile -type f -name 'v38-pregame-*.json' | wc -l)" -eq 0 ]; then echo "No profile snapshot candidates for ${DATE}"; exit 3; fi
          mapfile -t CTX_IDS < <(gh api "repos/${GH_REPO}/actions/workflows/v38-context-snapshot.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select((.created_at|startswith(\"${DATE}\")) or (.created_at|startswith(\"${NEXT_UTC_DATE}\"))) | .id" || true)
          for ID in "${CTX_IDS[@]:-}"; do [ -n "$ID" ] || continue; mkdir -p "incoming/contexts/$ID"; gh run download "$ID" --repo "$GH_REPO" --name "v38-context-${ID}" --dir "incoming/contexts/$ID" || true; done
          mapfile -t PF_IDS < <(gh api "repos/${GH_REPO}/actions/workflows/v38-pitchfit-distribution.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select((.created_at|startswith(\"${DATE}\")) or (.created_at|startswith(\"${NEXT_UTC_DATE}\"))) | .id" || true)
          for ID in "${PF_IDS[@]:-}"; do [ -n "$ID" ] || continue; mkdir -p "incoming/modifiers/pitchfit/$ID"; gh run download "$ID" --repo "$GH_REPO" --name "v38-pitchfit-${ID}" --dir "incoming/modifiers/pitchfit/$ID" || true; done
          mapfile -t BB_IDS < <(gh api "repos/${GH_REPO}/actions/workflows/v38-recent-bbe-distribution.yml/runs?status=success&per_page=100" --jq ".workflow_runs[] | select((.created_at|startswith(\"${DATE}\")) or (.created_at|startswith(\"${NEXT_UTC_DATE}\"))) | .id" || true)
          for ID in "${BB_IDS[@]:-}"; do [ -n "$ID" ] || continue; mkdir -p "incoming/modifiers/bbe/$ID"; gh run download "$ID" --repo "$GH_REPO" --name "v38-recent-bbe-${ID}" --dir "incoming/modifiers/bbe/$ID" || true; done
          mapfile -t PARK_IDS < <(gh api "repos/${GH_REPO}/actions/workflows/v38-park-factor-snapshot.yml/runs?status=success&per_page=50" --jq ".workflow_runs[] | select((.created_at|startswith(\"${DATE}\")) or (.created_at|startswith(\"${NEXT_UTC_DATE}\"))) | .id" || true)
          for ID in "${PARK_IDS[@]:-}"; do [ -n "$ID" ] || continue; mkdir -p "incoming/park/$ID"; gh run download "$ID" --repo "$GH_REPO" --name "v38-park-factors-${ID}" --dir "incoming/park/$ID" || true; done
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "profile=$(find incoming/profile -type f -name 'v38-pregame-*.json' | wc -l) context=$(find incoming/contexts -type f -name 'v38-context-*.json' | wc -l) pitchfit=$(find incoming/modifiers -type f -name 'v38-pitchfit-*.json' | wc -l) bbe=$(find incoming/modifiers -type f -name 'v38-recent-bbe-*.json' | wc -l) park=$(find incoming/park -type f -name 'v38-park-factors-*.json' | wc -l)"
      - name: Build canonical research board
        run: node scripts/build-v38-live-research-board.mjs incoming/profile incoming/contexts incoming/modifiers "$DATE" incoming/park
      - name: Verify fail-closed board contract
        shell: bash
        run: |
          set -euo pipefail
          BOARD=$(find snapshots -type f -name 'v38-live-research-board-*.json' | sort | tail -1)
          python3 - "$BOARD" <<'PY'
          import json,sys,re
          z=json.load(open(sys.argv[1]))
          assert z['protocol']=='V38_LIVE_RESEARCH_BOARD_V1'
          assert z['point_in_time'] is True
          assert z['research_only'] is True
          assert z['scoring_enabled'] is False
          assert z['scoring_eligible'] is False
          assert z['pool_target_forced'] is False
          assert z['pool_target_role']=='TARGET_ONLY_NOT_FORCED'
          a=z['pool_architecture']
          assert a['protocol']=='V38_POOL_ARCHITECTURE_V2'
          assert a['shortlist_protocol']=='V38_POOL_SHORTLIST_V3'
          assert a['first_prospective_date']=='2026-09-04'
          assert a['production_rule_changed'] is False
          assert a['final_pool_promoted'] is False
          assert a['review_queue_no_minimum'] is True
          games=a['slate_game_count']; ceiling=a['dynamic_review_policy']['ceiling']
          assert ceiling==(20 if games<=8 else 25 if games<=12 else 30)
          assert z['counts']['slate_games']==games
          assert z['counts']['review_queue_ceiling']==ceiling
          assert re.fullmatch(r'[a-f0-9]{64}',z.get('profile_snapshot_sha256') or '')
          assert z['park_factor_policy']['requires_exact_effective_bat_side'] is True
          assert z['park_factor_policy']['hard_gate'] is False
          assert z['park_factor_policy']['standalone_hr_boost'] is False
          assert z['park_factor_policy']['scoring_eligible'] is False
          assert isinstance(z['rows'],list) and isinstance(z['review_queue'],list)
          layers={'CORE','PROTECTED_POOL','QUALITY_VALUE_POOL','ESCAPE_WATCH','OUTSIDE_PRIMARY_POOL'}
          statuses={'RETAIN_FOR_FINAL_REVIEW','PENDING_EVIDENCE','OUTSIDE_PRIMARY_POOL'}
          layer_counts={k:0 for k in layers}; retain=0; pending=0
          for r in z['rows']:
            assert r.get('pool_layer') in layers
            assert r.get('shortlist',{}).get('status') in statuses
            layer_counts[r['pool_layer']]+=1
            assert r.get('structured_pool_candidate')==(r['pool_layer']!='OUTSIDE_PRIMARY_POOL')
            assert r.get('final_review_queue')==(any(q['player_id']==r['player_id'] for q in z['review_queue']))
            if r['shortlist']['status']=='RETAIN_FOR_FINAL_REVIEW': retain+=1
            if r['shortlist']['status']=='PENDING_EVIDENCE': pending+=1
            if r['pool_layer']=='CORE':
              assert r['shortlist']['status']=='RETAIN_FOR_FINAL_REVIEW'
              assert r['final_review_queue'] is True
            if r['pool_layer']=='ESCAPE_WATCH':
              assert r.get('quality_tier')=='BASE_ELIGIBLE_4OF6'
              assert (r.get('american_odds') or 0)>=700
              assert r.get('longshot_policy',{}).get('qualifies') is True
            if r.get('american_odds') is not None and r['american_odds']>=700:
              assert isinstance(r.get('longshot_policy'),dict)
            if r.get('context',{}).get('captured_at'):
              assert re.fullmatch(r'[a-f0-9]{64}',r.get('context',{}).get('snapshot_sha256') or '')
              assert r['context']['captured_at'] < r['start_time']
            pf=r.get('park_factor')
            if pf:
              assert r.get('context',{}).get('effective_bat_side') in ('L','R')
              assert pf['bat_side']==r['context']['effective_bat_side']
              assert pf['hard_gate'] is False
              assert pf['standalone_hr_boost'] is False
              assert pf['scoring_eligible'] is False
              assert pf['captured_at'] < r['start_time']
              assert pf.get('snapshot_sha256')
          assert z['counts']['core_rows']==layer_counts['CORE']
          assert z['counts']['protected_pool_rows']==layer_counts['PROTECTED_POOL']
          assert z['counts']['quality_value_pool_rows']==layer_counts['QUALITY_VALUE_POOL']
          assert z['counts']['escape_watch_rows']==layer_counts['ESCAPE_WATCH']
          assert z['counts']['structured_pool_candidates']==sum(layer_counts[k] for k in ('CORE','PROTECTED_POOL','QUALITY_VALUE_POOL','ESCAPE_WATCH'))
          assert z['counts']['shortlist_retain_rows']==retain
          assert z['counts']['pending_evidence_rows']==pending
          assert z['counts']['final_review_queue_rows']==len(z['review_queue'])
          assert len(z['review_queue'])<=ceiling or z['counts']['core_rows']>ceiling
          assert z['counts']['review_queue_trimmed_rows']==max(0,retain-len(z['review_queue']))
          print('V38_LIVE_BOARD_CONTRACT='+json.dumps({'date':z['date'],'counts':z['counts'],'coverage':z['coverage']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v38-live-research-board-${{ github.run_id }}
          path: snapshots/v38-live-research-board-*.json
          if-no-files-found: error
          retention-days: 30
