name: v38 Custom PullAir Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-v38-custom-pullair.mjs'
      - '.github/workflows/v38-custom-pullair-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax preflight
        run: node --check scripts/diagnose-v38-custom-pullair.mjs
      - name: Probe exact Savant custom PullAir inputs
        run: node scripts/diagnose-v38-custom-pullair.mjs
