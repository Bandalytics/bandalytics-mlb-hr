name: v38 Pregame Snapshot
on:
  schedule:
    - cron: '11 14 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/capture-v38-pregame-snapshot.mjs'
      - '.github/workflows/v38-pregame-snapshot.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax preflight
        run: node --check scripts/capture-v38-pregame-snapshot.mjs
      - name: Capture immutable pregame v38 profile snapshot
        run: node scripts/capture-v38-pregame-snapshot.mjs
      - name: Verify fail-closed pregame contract
        shell: bash
        run: |
          set -euo pipefail
          F=$(find snapshots -type f -name 'v38-pregame-*.json' | sort | tail -1)
          node --input-type=module - "$F" <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const file=process.argv[2],z=JSON.parse(fs.readFileSync(file,'utf8'));
          if(z.point_in_time!==true||z.research_only!==true||z.scoring_enabled!==false||z.scoring_eligible!==false||z.model_scoring_changed!==false) throw Error('unsafe pregame flags');
          if(!Array.isArray(z.pregame_games)||!Array.isArray(z.excluded_started_games)) throw Error('bad game arrays');
          const captured=Date.parse(z.captured_at);
          if(!Number.isFinite(captured)) throw Error('bad captured_at');
          for(const g of z.pregame_games){const start=Date.parse(g.start_time);if(!Number.isFinite(start)||start<=captured) throw Error(`non-pregame game ${g.gamePk}`);}
          if(typeof z.sha256!=='string'||!/^[a-f0-9]{64}$/.test(z.sha256)) throw Error('bad sha256');
          const {sha256,...body}=z,calc=crypto.createHash('sha256').update(JSON.stringify(body)).digest('hex');
          if(calc!==sha256) throw Error('pregame sha256 mismatch');
          for(const k of ['games_total','team_count','player_count','profile_complete']) if(!Number.isFinite(Number(z[k]))||Number(z[k])<0) throw Error(`bad ${k}`);
          console.log('V38_PREGAME_CONTRACT_OK='+JSON.stringify({date:z.date,captured_at:z.captured_at,pregame_games:z.pregame_games.length,excluded_started:z.excluded_started_games.length,profile_complete:z.profile_complete,sha256:z.sha256}));
          NODE
      - name: Show snapshot summary
        run: |
          python3 - <<'PY'
          import json,glob
          p=sorted(glob.glob('snapshots/v38-pregame-*.json'))[-1]
          z=json.load(open(p))
          print('SNAPSHOT='+json.dumps({k:z[k] for k in ['date','captured_at','games_total','team_count','player_count','profile_complete','sha256']}))
          print('PREGAME_GAMES='+str(len(z['pregame_games'])))
          print('EXCLUDED_STARTED='+str(len(z['excluded_started_games'])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v38-pregame-${{ github.run_id }}
          path: snapshots/v38-pregame-*.json
          if-no-files-found: error
          retention-days: 90
