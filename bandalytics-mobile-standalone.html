<style>

*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 50% -140px,rgba(255,51,72,.085),transparent 330px),linear-gradient(180deg,#030405,#020304)}button{font:inherit}.wrap{width:100%;max-width:760px;margin:0 auto;padding:8px 10px calc(30px + env(safe-area-inset-bottom))}.apphead{padding:8px 2px 12px}.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px}.mark{width:32px;height:32px;border:1px solid rgba(255,51,72,.58);border-radius:9px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,51,72,.08),rgba(255,51,72,.02));box-shadow:inset 0 0 0 1px rgba(255,51,72,.035)}.mark:before{content:"B";font-size:12px;font-weight:950;color:var(--red)}.brandname{font-size:16px;font-weight:950;letter-spacing:.14em}.brandname em{font-style:normal;color:var(--red)}.mode{font-size:7.2px;font-weight:950;letter-spacing:.18em;color:#8c95a1;margin-top:2px}.headtag{font-size:6.7px;font-weight:950;letter-spacing:.12em;color:#c6ccd3;border:1px solid var(--line);border-radius:999px;padding:5px 7px}.flow{display:flex;align-items:center;gap:7px;margin-top:10px;color:#727c89;font-size:7.7px;font-weight:900;letter-spacing:.14em}.flow b{color:#b8c0ca}.flow i{display:block;width:18px;height:1px;background:linear-gradient(90deg,rgba(255,51,72,.75),rgba(255,51,72,.08))}
.boardhero{position:relative;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#0b0e12,#07090c);padding:14px 13px 13px;overflow:hidden}.boardhero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--red),rgba(255,51,72,.05))}.eyebrow{font-size:7.1px;font-weight:950;letter-spacing:.17em;color:var(--red)}.boardhero h1{font-size:28px;line-height:1;margin:5px 0 5px;letter-spacing:-.045em}.boardsub{font-size:8.8px;line-height:1.45;color:var(--muted);max-width:520px}.boardstats{display:flex;gap:5px;overflow-x:auto;margin-top:10px;scrollbar-width:none}.boardstats::-webkit-scrollbar,.tabs::-webkit-scrollbar,.metricstrip::-webkit-scrollbar{display:none}.stat{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#07090c;padding:5px 7px;font-size:6.8px;font-weight:900;color:#aeb6c1}.stat.red{border-color:rgba(255,51,72,.26);color:#ff8b98;background:rgba(255,51,72,.035)}.stat.green{border-color:rgba(61,220,132,.22);color:#8be8b4}.sectionbar{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:14px 1px 7px}.sectionbar h2{font-size:14px;margin:0;letter-spacing:.03em}.sectionbar span{font-size:6.8px;color:#747e8b}.gameboard{display:grid;gap:7px}.gamecard{appearance:none;-webkit-appearance:none;width:100%;text-align:left;color:var(--text);border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#090c10,#06080b);padding:11px 11px 10px;position:relative;overflow:hidden}.gamecard:after{content:"›";position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:21px;color:#58616d}.gamecard.featured{border-color:rgba(255,51,72,.42);box-shadow:inset 2px 0 0 rgba(255,51,72,.86),0 0 20px rgba(255,51,72,.035)}.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:18px}.matchup{font-size:17px;font-weight:950;letter-spacing:-.025em}.matchup .home{color:var(--red2)}.status{display:flex;align-items:center;gap:5px;font-size:6.6px;color:#9aa4b0;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:#727b86}.dot.confirmed{background:var(--green);box-shadow:0 0 9px rgba(61,220,132,.35)}.dot.projected{background:var(--amber)}.gmeta{font-size:7.5px;color:var(--muted);margin-top:4px}.gchips{display:flex;gap:5px;overflow:hidden;margin-top:8px;padding-right:20px}.gchip{min-width:0;flex:0 1 auto;border:1px solid rgba(255,255,255,.055);border-radius:7px;padding:4px 6px;font-size:6.4px;color:#9ca6b2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#07090c}.gchip.hot{border-color:rgba(255,51,72,.2);color:#ff8491}.gchip b{color:#d8dde3}.empty{padding:14px;color:var(--muted);font-size:8.8px}.err{color:#ff7b72}.detailtop{display:flex;align-items:center;gap:7px;margin:2px 0 8px}.backbtn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:#080a0d;color:#cbd2da;border-radius:8px;padding:6px 8px;font-size:7px;font-weight:950;letter-spacing:.08em}.detailcap{font-size:7px;color:#77818e;letter-spacing:.12em}.hero{border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,#0a0d11,#06080b);overflow:visible;box-shadow:0 12px 30px rgba(0,0,0,.22)}.herohead{padding:12px;border-bottom:1px solid var(--line2)}.matchtitle{font-size:24px;font-weight:950;letter-spacing:-.045em;margin:4px 0 3px}.matchtitle .home{color:var(--red2)}.matchmeta{font-size:8px;line-height:1.4;color:var(--muted)}.chips{display:flex;gap:5px;overflow-x:auto;padding:8px 9px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#07090c;padding:5px 7px;font-size:6.6px;font-weight:900;color:#aeb6c0}.chip.red{color:#ff8995;border-color:rgba(255,51,72,.25);background:rgba(255,51,72,.03)}.chip.green{color:#8be8b4;border-color:rgba(61,220,132,.2)}.tabs{display:flex;overflow-x:auto;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 8px}.tab{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#707a87;padding:10px 11px 9px;font-size:7.3px;font-weight:950;letter-spacing:.1em;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:#fff;border-color:var(--red)}.panel{padding:9px}.linegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.team{position:relative;border:1px solid rgba(255,255,255,.06);border-radius:10px;background:linear-gradient(180deg,#080b0f,#05070a);padding:8px;min-width:0}.team:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:linear-gradient(180deg,rgba(255,51,72,.85),rgba(255,51,72,.05))}.th{display:flex;justify-content:space-between;align-items:center;gap:5px;border-bottom:1px solid var(--line2);padding:0 0 6px 4px;margin-bottom:3px}.th b{font-size:10.2px}.th span{font-size:6px;font-weight:950;color:#9aa3af;letter-spacing:.06em}.row{display:grid;grid-template-columns:13px minmax(0,1fr);gap:4px;align-items:center;min-height:29px;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.025);position:relative}.row:last-child{border-bottom:0}.row.qual{border-radius:7px;background:linear-gradient(90deg,rgba(255,51,72,.11),rgba(255,51,72,.018));box-shadow:inset 2px 0 0 rgba(255,51,72,.82)}.ord{font-size:7px;color:#66707d}.pbox{min-width:0}.pname{font-size:8.2px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qtag{display:block;font-size:5.8px;font-weight:950;color:#ff8793;margin-top:2px;letter-spacing:.035em}.top3{display:grid;gap:6px}.pickcard{position:relative;border:1px solid rgba(255,51,72,.18);border-radius:10px;padding:9px;background:linear-gradient(90deg,rgba(255,51,72,.07),rgba(255,51,72,.012));box-shadow:inset 2px 0 0 rgba(255,51,72,.68)}.picktop{display:flex;align-items:center;justify-content:space-between;gap:8px}.picktop b{font-size:9.8px}.badge{font-size:5.9px;font-weight:950;padding:3px 5px;border-radius:6px;border:1px solid rgba(255,51,72,.44);color:#ff8a96;background:rgba(255,51,72,.055);white-space:nowrap}.metricstrip{display:flex;gap:4px;overflow-x:auto;margin-top:6px}.metric{flex:0 0 auto;font-size:6.2px;color:#98a2ae;border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:3px 4px;background:#06080b}.insights{display:grid;gap:6px}.insight{border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:9px;background:linear-gradient(180deg,#080a0d,#06080a)}.insight h4{font-size:7.5px;letter-spacing:.1em;color:#ff7482;margin:0 0 6px}.ctxrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:7.4px}.ctxrow:last-child{border-bottom:0}.ctxrow span{color:var(--muted);flex:0 0 34%}.ctxrow b{text-align:right;font-size:7.2px;line-height:1.35;color:#d5dbe3}.bottomnav{margin-top:13px;border:1px solid rgba(255,255,255,.055);border-radius:13px;background:#07090c;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 3px}.navitem{text-align:center;color:#626c79;font-size:6.3px;font-weight:900;letter-spacing:.05em;cursor:pointer}.navitem b{display:block;color:#9fa9b5;font-size:9px;margin-bottom:2px}.navitem.active,.navitem.active b{color:var(--red2)}.note{color:#68727f;font-size:6.8px;line-height:1.45;margin:8px 2px 0}@media(max-width:350px){.linegrid{grid-template-columns:1fr}.pname{font-size:8.6px}}
</style>
