<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>BANDALYTICS Mobile Research</title>
<style>
:root{--bg:#05080d;--panel:#0a1018;--panel2:#081019;--line:rgba(255,255,255,.08);--muted:#8995a5;--text:#f5f7fa;--red:#ff4358;--gold:#e9bf63;--gold2:#ffdfa0;--blue:#69a8ff;--blue2:#9bc7ff;--green:#7fe59a}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 50% -220px,rgba(35,56,86,.35),transparent 460px),var(--bg)}button{font:inherit}.wrap{width:100%;max-width:760px;margin:0 auto;padding:8px 10px calc(38px + env(safe-area-inset-bottom))}
.apphead{padding:8px 2px 10px}.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px}.mark{width:31px;height:31px;border:1px solid rgba(255,67,88,.68);border-radius:9px;display:grid;place-items:center;color:var(--red);background:rgba(255,67,88,.05)}.mark:before{content:"B";font-size:12px;font-weight:950}.brandname{font-size:15px;font-weight:950;letter-spacing:.13em}.mode{font-size:7.6px;font-weight:950;letter-spacing:.14em;color:var(--red);margin-top:2px}.livepill{font-size:7px;font-weight:950;letter-spacing:.08em;color:#99efac;border:1px solid rgba(127,229,154,.27);background:rgba(127,229,154,.04);border-radius:999px;padding:5px 7px}.flow{display:flex;align-items:center;gap:6px;margin-top:10px;color:#8f9aaa;font-size:8px;font-weight:900;letter-spacing:.12em}.flow b{color:#dce2ea}.flow i{display:block;width:18px;height:1px;background:linear-gradient(90deg,rgba(233,191,99,.7),rgba(105,168,255,.35))}
.hero{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#0d1520,#081019);overflow:visible;box-shadow:0 14px 34px rgba(0,0,0,.2)}.herohead{padding:12px 12px 10px;border-bottom:1px solid rgba(255,255,255,.05)}.eyebrow{font-size:7.4px;font-weight:950;letter-spacing:.15em;color:var(--red)}.matchtitle{font-size:24px;font-weight:950;letter-spacing:-.04em;margin:4px 0 3px}.matchmeta{font-size:8.7px;line-height:1.4;color:var(--muted)}.chips{display:flex;gap:5px;overflow-x:auto;padding:9px 10px 10px;scrollbar-width:none}.chips::-webkit-scrollbar,.rail::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#091019;padding:5px 7px;font-size:7.2px;font-weight:900;color:#c5ced9}.chip.gold{color:var(--gold2);border-color:rgba(233,191,99,.3)}.chip.blue{color:var(--blue2);border-color:rgba(105,168,255,.28)}.chip.green{color:#9aefad;border-color:rgba(127,229,154,.25)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 8px 0}.tab{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#7f8b9a;padding:8px 10px 9px;font-size:7.7px;font-weight:950;letter-spacing:.1em;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:#f4f7fb;border-color:var(--gold)}
.panel{padding:9px}.linegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.team{position:relative;border:1px solid rgba(255,255,255,.065);border-radius:11px;background:linear-gradient(180deg,#09111a,#070c12);padding:8px;min-width:0}.team:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:linear-gradient(180deg,rgba(105,168,255,.8),rgba(105,168,255,.08))}.th{display:flex;justify-content:space-between;align-items:center;gap:5px;border-bottom:1px solid rgba(255,255,255,.045);padding:0 0 6px 4px;margin-bottom:3px}.th b{font-size:10.7px}.th span{font-size:6.4px;font-weight:950;color:var(--blue2);letter-spacing:.06em}.row{display:grid;grid-template-columns:13px minmax(0,1fr);gap:4px;align-items:center;min-height:28px;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.028);position:relative}.row:last-child{border-bottom:0}.row.qual{border-radius:7px;background:linear-gradient(90deg,rgba(233,191,99,.11),rgba(233,191,99,.02));box-shadow:inset 2px 0 0 rgba(233,191,99,.8)}.ord{font-size:7px;color:#657180}.pbox{min-width:0}.pname{font-size:8.2px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qtag{display:block;font-size:5.9px;font-weight:950;color:var(--gold2);margin-top:2px;letter-spacing:.03em}.qtag.blue{color:var(--blue2)}
.sectionlabel{font-size:7.4px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#a9b2bf;margin:10px 1px 6px}.top3{display:grid;gap:6px}.pickcard{position:relative;border:1px solid rgba(233,191,99,.18);border-radius:10px;padding:9px;background:linear-gradient(90deg,rgba(233,191,99,.08),rgba(233,191,99,.018));box-shadow:inset 2px 0 0 rgba(233,191,99,.68)}.picktop{display:flex;align-items:center;justify-content:space-between;gap:8px}.picktop b{font-size:10px}.badge{font-size:6px;font-weight:950;padding:3px 5px;border-radius:6px;border:1px solid rgba(233,191,99,.5);color:var(--gold2);background:rgba(233,191,99,.07);white-space:nowrap}.metricstrip{display:flex;gap:4px;overflow-x:auto;margin-top:6px}.metric{flex:0 0 auto;font-size:6.4px;color:#9ba6b3;border:1px solid rgba(255,255,255,.055);border-radius:6px;padding:3px 4px;background:#080e15}.insights{display:grid;gap:6px}.insight{border:1px solid rgba(105,168,255,.12);border-radius:10px;padding:9px;background:linear-gradient(90deg,rgba(105,168,255,.05),transparent)}.insight h4{font-size:8px;letter-spacing:.08em;color:var(--blue2);margin:0 0 6px}.ctxrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.035);font-size:7.6px}.ctxrow:last-child{border-bottom:0}.ctxrow span{color:var(--muted);flex:0 0 34%}.ctxrow b{text-align:right;font-size:7.4px;line-height:1.35;color:#d5dce5}.empty{padding:14px;color:var(--muted);font-size:8.8px}.err{color:#ff7b72}
.slatelabel{font-size:7.4px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#9da7b4;margin:12px 2px 6px}.rail{display:flex;gap:6px;overflow-x:auto;padding:1px 0 7px;scroll-snap-type:x proximity}.gamebtn{appearance:none;-webkit-appearance:none;flex:0 0 134px;scroll-snap-align:start;text-align:left;color:var(--text);border:1px solid var(--line);border-radius:10px;background:#081019;padding:8px;min-height:56px}.gamebtn.active{border-color:rgba(255,67,88,.58);background:rgba(255,67,88,.055);box-shadow:inset 2px 0 0 rgba(255,67,88,.75)}.gamebtn b{display:block;font-size:9.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gamebtn small{display:block;font-size:6.6px;line-height:1.25;color:var(--muted);margin-top:3px}.gamebtn .screen{color:var(--gold2)}
.bottomnav{margin-top:12px;border:1px solid rgba(255,255,255,.06);border-radius:13px;background:#080e15;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 3px}.navitem{text-align:center;color:#687484;font-size:6.4px;font-weight:900;letter-spacing:.05em}.navitem b{display:block;color:#aeb8c5;font-size:9px;margin-bottom:2px}.navitem.active,.navitem.active b{color:var(--gold2)}.note{color:#6f7b89;font-size:7px;line-height:1.45;margin:8px 2px 0}
@media(max-width:350px){.linegrid{grid-template-columns:1fr}.team+.team{margin-top:0}.pname{font-size:8.6px}}
</style>
</head>
<body>
<main id="app" class="wrap">
<header class="apphead">
<div class="brandbar"><div class="brand"><div class="mark" aria-hidden="true"></div><div><div class="brandname">BANDALYTICS</div><div class="mode">MLB RESEARCH</div></div></div><div class="livepill">RESEARCH ONLY</div></div>
<div class="flow"><b>DATA</b><i></i><b>PROCESS</b><i></i><b>PICKS</b></div>
</header>
<div class="slatelabel">Today’s games</div>
<div id="rail" class="rail"></div>
<div id="game"></div>
<nav class="bottomnav" aria-label="BANDALYTICS mobile navigation"><div class="navitem active"><b>▦</b>BOARD</div><div class="navitem"><b>◇</b>GAMES</div><div class="navitem"><b>≡</b>FILTERS</div><div class="navitem"><b>☆</b>MY PICKS</div><div class="navitem"><b>•••</b>MORE</div></nav>
<div class="note">Research-only mobile presentation. The locked six-metric gate and prospective evidence rules remain unchanged.</div>
</main>
<script src="/bandalytics-mobile-standalone.js?v=3"></script>
</body>
</html>
