<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BANDALYTICS Mobile Research</title><style>html,body{margin:0;padding:0;background:#070a0f;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}.wrap{padding:14px 12px calc(40px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}.k{font-size:10px;font-weight:900;letter-spacing:.15em;color:#ff4b5d}.h{font-size:28px;font-weight:900;letter-spacing:-.03em;margin:5px 0 6px}.sub{color:#9aa4b2;font-size:13px;line-height:1.45;margin-bottom:12px}.stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;color:#c7ced8}.game{border:1px solid rgba(255,255,255,.09);border-radius:14px;background:#0d1219;margin:0 0 10px;overflow:visible}.gh{padding:12px;border-bottom:1px solid rgba(255,255,255,.07)}.gh b{font-size:17px}.gh small{display:block;color:#9aa4b2;margin-top:4px}.teams{display:block;padding:9px}.team{border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:9px;margin-bottom:8px;background:#0a0f15}.th{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}.th span{font-size:9px;font-weight:900;color:#f0b44c}.row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}.row:last-child{border-bottom:0}.ord{color:#707a88}.badge{font-size:8px;font-weight:950;padding:3px 5px;border-radius:7px;border:1px solid rgba(232,190,95,.48);color:#f3cc79;background:rgba(232,190,95,.08);white-space:nowrap}.elite{border-color:rgba(126,231,135,.45);color:#8be895;background:rgba(126,231,135,.07)}.empty{padding:14px;color:#9aa4b2}.err{color:#ff7b72}</style></head><body><main id="app" class="wrap"><div class="k">BANDALYTICS • MOBILE ISOLATION</div><div class="h">Today’s MLB Research</div><div class="sub">Standalone mobile renderer. No desktop shell, no nested workspace, no scoring or ticket logic.</div><div id="status" class="stats"><span class="chip">Loading slate…</span></div><div id="games"></div></main><script src="/bandalytics-mobile-standalone.js?v=1"></script></body></html>
