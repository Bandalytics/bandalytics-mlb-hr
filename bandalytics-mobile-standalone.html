*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 50% -140px,rgba(255,51,72,.085),transparent 330px),linear-gradient(180deg,#030405,#020304)}button{font:inherit}.wrap{width:100%;max-width:760px;margin:0 auto;padding:8px 10px calc(118px + env(safe-area-inset-bottom))}.apphead{padding:8px 2px 12px}.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px}.mark{width:32px;height:32px;border:1px solid rgba(255,51,72,.58);border-radius:9px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,51,72,.08),rgba(255,51,72,.02))}.mark:before{content:"B";font-size:12px;font-weight:950;color:var(--red)}.brandname{font-size:16px;font-weight:950;letter-spacing:.14em}.brandname em{font-style:normal;color:var(--red)}.mode{font-size:7.2px;font-weight:950;letter-spacing:.18em;color:#8c95a1;margin-top:2px}.headtag{font-size:6.7px;font-weight:950;letter-spacing:.12em;color:#c6ccd3;border:1px solid var(--line);border-radius:999px;padding:5px 7px}.flow{display:flex;align-items:center;gap:7px;margin-top:10px;color:#727c89;font-size:7.7px;font-weight:900;letter-spacing:.14em}.flow b{color:#b8c0ca}.flow i{display:block;width:18px;height:1px;background:linear-gradient(90deg,rgba(255,51,72,.75),rgba(255,51,72,.08))}
.boardhero,.filterhero,.pickhero,.morecard{position:relative;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#0b0e12,#07090c);padding:14px 13px}.boardhero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--red),rgba(255,51,72,.05))}.eyebrow{font-size:7.1px;font-weight:950;letter-spacing:.17em;color:var(--red)}.boardhero h1,.filterhero h1,.pickhero h1{font-size:28px;line-height:1;margin:5px 0 5px;letter-spacing:-.045em}.boardsub{font-size:8.8px;line-height:1.45;color:var(--muted);max-width:520px}.boardstats,.chips,.metricstrip,.toplookstrip{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.boardstats{margin-top:10px}.boardstats::-webkit-scrollbar,.chips::-webkit-scrollbar,.metricstrip::-webkit-scrollbar,.toplookstrip::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}.stat,.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#07090c;padding:5px 7px;font-size:6.8px;font-weight:900;color:#aeb6c1}.stat.red,.chip.red{border-color:rgba(255,51,72,.26);color:#ff8b98}.stat.green,.chip.green{border-color:rgba(61,220,132,.22);color:#8be8b4}.sectionbar{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:14px 1px 7px}.sectionbar h2{font-size:14px;margin:0}.sectionbar span{font-size:6.8px;color:#747e8b}.gameboard{display:grid;gap:7px}.gamecard{appearance:none;-webkit-appearance:none;width:100%;text-align:left;color:var(--text);border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,#090c10,#06080b);padding:11px 11px 10px;position:relative;overflow:hidden}.gamecard:after{content:"›";position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:21px;color:#58616d}.gamecard.featured{border-color:rgba(255,51,72,.42);box-shadow:inset 2px 0 0 rgba(255,51,72,.86)}.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:18px}.matchup{font-size:17px;font-weight:950 <script>
(function(){const nativeFetch=window.fetch.bind(window);window.fetch=async function(input,init){const url=typeof input==='string'?input:(input&&input.url)||'';const profile=url.includes('/api/profile-v38-candidate');const tries=profile?4:1;let last=null;for(let i=0;i<tries;i++){try{const r=await nativeFetch(input,init);last=r;if(!profile||r.ok||![502,503,504].includes(r.status))return r}catch(e){if(!profile||i===tries-1)throw e}if(i<tries-1)await new Promise(res=>setTimeout(res,[200,500,1000][i]||1200))}return last};window.__BANDALYTICS_MOBILE_FETCH_RETRY={profileEndpoint:true,retries:4};})();
