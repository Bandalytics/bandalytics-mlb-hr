<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030304"><title>BANDALYTICS</title><style>
:root{--bg:#030304;--p:#0a0c0f;--p2:#101318;--line:rgba(255,255,255,.08);--text:#f5f7f9;--muted:#87909b;--red:#ff354b;--red2:#ff6677;--green:#43dd89;--blue:#65a8ff;--gold:#f0c35a}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 50% -130px,rgba(255,53,75,.12),transparent 340px),#030304}.app{max-width:760px;margin:auto;padding:12px 12px calc(92px + env(safe-area-inset-bottom))}.head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}.brand{font-size:22px;font-weight:950;letter-spacing:.08em}.brand span{color:var(--red)}.live{font-size:10px;color:#98a1ab}.hero{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#0d1014,#07090c);padding:15px;margin-bottom:14px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--red);font-weight:900}.hero h1{font-size:31px;margin:4px 0 7px;letter-spacing:-.04em}.sub{font-size:12px;line-height:1.45;color:var(--muted)}.stats,.chips,.tags,.metricstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.stats::-webkit-scrollbar,.chips::-webkit-scrollbar,.tags::-webkit-scrollbar,.metricstrip::-webkit-scrollbar{display:none}.stat,.chip,.tag,.metric{flex:0 0 auto;border:1px solid var(--line);background:#080a0d;border-radius:999px;padding:6px 8px;font-size:9px;color:#aeb6c0}.stat.red,.tag.core{border-color:rgba(255,53,75,.35);color:#ff8492}.stat.green{border-color:rgba(67,221,137,.25);color:#91e9b8}.tag.blue{border-color:rgba(101,168,255,.4);color:#8ec0ff}.tag.gold{border-color:rgba(240,195,90,.42);color:#f4cf76}.sectionbar{display:flex;align-items:end;justify-content:space-between;margin:16px 2px 8px}.sectionbar h2{font-size:18px;margin:0}.sectionbar span{font-size:10px;color:#737c87}.gameboard{display:grid;gap:9px}.game{width:100%;text-align:left;color:inherit;border:1px solid var(--line);border-radius:15px;background:linear-gradient(180deg,#0b0e12,#07090c);padding:13px;position:relative}.game:after{content:'›';position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:26px;color:#5e6670}.gtop{display:flex;justify-content:space-between;gap:12px;padding-right:20px}.matchup{font-size:19px;font-weight:900}.matchup b{color:var(--red2)}.status{font-size:9px;color:#9ca5af}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#777;margin-right:5px}.dot.c{background:var(--green)}.dot.p{background:#e3b23c}.meta{font-size:10px;color:var(--muted);margin-top:4px}.chips{margin-top:9px}.chip{font-size:8px;padding:5px 7px}.topstrip{display:flex;gap:8px;overflow-x:auto}.playercard{flex:0 0 175px;border:1px solid var(--line);border-radius:14px;background:#090b0f;padding:11px}.playercard strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pm{font-size:9px;color:var(--muted);margin-top:3px}.tags{margin-top:7px;flex-wrap:wrap;overflow:visible}.tag{font-size:7px;padding:4px 6px}.save{margin-top:8px;border:1px solid var(--line);background:#07090c;color:#aaa;border-radius:8px;padding:6px 8px;font-size:8px}.save.on{color:#ff8190;border-color:rgba(255,53,75,.4)}.detailtop{display:flex;align-items:center;gap:8px;margin-bottom:8px}.back{border:1px solid var(--line);background:#080a0d;color:#ddd;border-radius:9px;padding:7px 9px;font-size:9px}.detail{border:1px solid var(--line);border-radius:18px;background:#090b0f;overflow:hidden}.dhead{padding:14px;border-bottom:1px solid var(--line)}.dhead h1{font-size:29px;margin:4px 0}.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}.tab{border:0;background:transparent;color:#747e89;padding:12px 14px;font-size:9px;font-weight:900;border-bottom:2px solid transparent}.tab.on{color:#fff;border-bottom-color:var(--red)}.panel{padding:10px}.linegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.team{border:1px solid var(--line);border-radius:13px;padding:9px;background:#07090c}.th{display:flex;justify-content:space-between;padding-bottom:7px;border-bottom:1px solid var(--line);font-size:11px}.row{display:grid;grid-template-columns:16px 1fr;gap:5px;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.04)}.row:last-child{border:0}.row.qual{background:linear-gradient(90deg,rgba(255,53,75,.09),transparent);box-shadow:inset 2px 0 0 rgba(255,53,75,.8);border-radius:7px}.ord{font-size:9px;color:#66707b}.pn{font-size:10px;font-weight:800}.metricstrip{margin-top:8px}.metric{font-size:7px;padding:4px 6px}.filterbox{border:1px solid var(--line);border-radius:18px;background:#090b0f;padding:15px}.filterbox h1{font-size:29px;margin:4px 0}.filtergrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.fbtn{border:1px solid var(--line);border-radius:12px;background:#080a0d;color:#dce1e6;text-align:left;padding:11px}.fbtn b{font-size:11px}.fbtn span{display:block;color:#7d8792;font-size:8px;margin-top:3px}.fbtn.on{border-color:rgba(255,53,75,.45);background:rgba(255,53,75,.07);box-shadow:inset 2px 0 0 var(--red)}.actions{display:flex;gap:8px;margin-top:11px}.action{border:1px solid var(--line);background:#080a0d;color:#ddd;border-radius:9px;padding:8px 10px;font-size:9px}.action.red{color:#ff8190;border-color:rgba(255,53,75,.4)}.note{font-size:9px;color:#7e8791;line-height:1.45;margin-top:10px}.empty{padding:18px;color:#8b949e;font-size:11px}.nav{position:fixed;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));z-index:9999;max-width:736px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);border:1px solid rgba(255,255,255,.1);border-radius:17px;padding:8px 4px;background:rgba(7,9,12,.94);backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(0,0,0,.5)}.nav button{border:0;background:transparent;color:#737d88;font-size:8px;padding:3px}.nav button b{display:block;font-size:14px;margin-bottom:2px}.nav button.on{color:var(--red2)}@media(max-width:350px){.linegrid{grid-template-columns:1fr}}
</style></head><body><main class="app"><header class="head"><div class="brand">BAND<span>ALYTICS</span></div><div class="live" id="loadState">Loading…</div></header><div id="screen"></div></main><nav class="nav"><button data-nav="board" class="on"><b>⌂</b>BOARD</button><button data-nav="games"><b>◉</b>GAMES</button><button data-nav="filters"><b>⌁</b>FILTERS</button><button data-nav="picks"><b>☆</b>MY PICKS</button><button data-nav="more"><b>•••</b>MORE</button></nav><script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=x=>String(x??'—').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const gt=(v,n)=>Number.isFinite(+v)&&+v>n,num=(v,d=1)=>Number.isFinite(+v)?(+v).toFixed(d):'—';
const dateET=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),o=Object.fromEntries(p.map(x=>[x.type,x.value]));return`${o.year}-${o.month}-${o.day}`};
async function get(u,retries=0){let e;for(let i=0;i<=retries;i++){try{const r=await fetch(u,{cache:'no-store'}),z=await r.json();if(!r.ok||z?.ok!==true)throw Error(z?.error||`HTTP ${r.status}`);return z}catch(x){e=x;if(i<retries)await new Promise(r=>setTimeout(r,250*(i+1)))}}throw e}
const PICK='bandalytics:user-picks:v2',FILTER='bandalytics:user-filters:v2';
const defaults={foundation:false,pullPower:false,barrelMonster:false,eliteContact:false,longshot:false,confirmed:false};
const load=(k,f)=>{try{return Object.assign({},f,JSON.parse(localStorage.getItem(k)||'{}'))}catch{return{...f}}};
const S={date:dateET(),items:[],profiles:new Map(),market:new Map(),marketConnected:false,marketMessage:'Price feed unavailable',games:[],view:'board',tab:'lineups',active:null,filters:load(FILTER,defaults),picks:load(PICK,{})};
function counts(p){return{core:[gt(p?.barrel,8),gt(p?.hh,35),gt(p?.blast,8),gt(p?.pullair,18),gt(p?.ev,89),gt(p?.iso,.180)].filter(Boolean).length,foundation:[gt(p?.barrel,10),gt(p?.hh,40),gt(p?.pullair,20),gt(p?.iso,.200),gt(p?.ev,90),gt(p?.blast,10)].filter(Boolean).length,pullPower:[gt(p?.hh,40),gt(p?.pullair,30),gt(p?.iso,.220),gt(p?.barrel,10),gt(p?.pull,40),gt(p?.blast,10)].filter(Boolean).length,barrelMonster:[gt(p?.barrel,15),gt(p?.hh,50),gt(p?.ev,92),gt(p?.iso,.250),gt(p?.pullair,25),gt(p?.blast,15)].filter(Boolean).length,elite:[gt(p?.ev,92),gt(p?.hh,50),gt(p?.barrel,14),gt(p?.iso,.240),gt(p?.blast,14)].filter(Boolean).length}}
function meta(r){const p=S.profiles.get(+r.player_id),c=counts(p),m=S.market.get(+r.player_id),odds=Number.isFinite(+m?.best_odds)?+m.best_odds:null;const tags=[];if(c.foundation>=5)tags.push({k:'foundation',label:`FOUNDATION ${c.foundation}/6`,cls:'gold'});if(c.pullPower>=5)tags.push({k:'pullPower',label:`PULL POWER ${c.pullPower}/6`,cls:'gold'});if(c.barrelMonster>=5)tags.push({k:'barrelMonster',label:`BARREL MONSTER ${c.barrelMonster}/6`,cls:'gold'});if(c.elite>=3||(gt(p?.ev,93)&&gt(p?.hh,52)))tags.push({k:'eliteContact',label:'ELITE CONTACT WATCH',cls:'gold'});const longshotProfile=c.core>=4;if(longshotProfile)tags.push({k:'longshot',label:odds!=null&&odds>=700?`LONGSHOT +${odds} • ${c.core}/6`:`LONGSHOT PROFILE ${c.core}/6`,cls:'blue'});return{...r,p,c,tags,odds,longshotProfile,longshotQualified:longshotProfile&&odds!=null&&odds>=700}}
function build(){const gm=new Map();for(const r of S.items){const k=String(r.gamePk);if(!gm.has(k))gm.set(k,[]);gm.get(k).push(r)}S.games=[...gm.entries()].map(([gamePk,rows])=>{const all=rows.map(meta),teams=[...new Set(rows.map(x=>x.team))];return{gamePk,rows,all,teams,qualified:all.filter(x=>x.c.core>=5).length,confirmed:rows.filter(x=>x.lineup_type==='CONFIRMED').length}}).sort((a,b)=>b.qualified-a.qualified||b.confirmed-a.confirmed);if(!S.active&&S.games[0])S.active=S.games[0].gamePk}
const confirm=g=>g.confirmed===g.rows.length&&g.rows.length?'CONFIRMED':g.confirmed?'PARTIAL':'PROJECTED';
const pitcher=(g,t)=>g.rows.find(x=>x.team!==t)?.opp_pitcher||'TBD';
function passFilter(x){const f=S.filters;if(f.foundation&&!x.tags.some(t=>t.k==='foundation'))return false;if(f.pullPower&&!x.tags.some(t=>t.k==='pullPower'))return false;if(f.barrelMonster&&!x.tags.some(t=>t.k==='barrelMonster'))return false;if(f.eliteContact&&!x.tags.some(t=>t.k==='eliteContact'))return false;if(f.longshot&&!x.longshotProfile)return false;if(f.confirmed&&x.lineup_type!=='CONFIRMED')return false;return true}
const fcount=()=>Object.values(S.filters).filter(Boolean).length;
const universe=()=>S.games.flatMap(g=>g.all).filter(x=>fcount()?passFilter(x):true);
function tags(x){let out=x.tags.map(t=>`<span class="tag ${t.cls}">${esc(t.label)}</span>`).join('');if(x.c.core===6)out+=`<span class="tag core">CORE 6/6</span>`;else if(x.c.core===5)out+=`<span class="tag core">CORE 5/6</span>`;if(x.longshotProfile&&!x.longshotQualified)out+=`<span class="tag blue">${S.marketConnected?'PRICE BELOW +700 / UNAVAILABLE':'PRICE NEEDED'}</span>`;return out}
const saved=x=>!!S.picks[String(x.player_id)];
const saveBtn=x=>`<button class="save ${saved(x)?'on':''}" data-save="${esc(x.player_id)}">${saved(x)?'★ SAVED':'☆ SAVE'}</button>`;
function board(){const top=universe().filter(x=>x.p).sort((a,b)=>b.c.core-a.c.core||a.lineup-b.lineup).slice(0,5),confirmed=S.games.filter(g=>confirm(g)==='CONFIRMED').length;$('#screen').innerHTML=`<section class="hero"><div class="eyebrow">TODAY • MLB</div><h1>Today</h1><div class="sub">Choose a matchup or use your own filters. Qualification badges describe the profile; filters only change your view.</div><div class="stats"><span class="stat">${S.games.length} GAMES</span><span class="stat red">${S.games.reduce((n,g)=>n+g.qualified,0)} CORE 5/6+</span><span class="stat green">${confirmed} CONFIRMED</span>${fcount()?`<span class="stat red">${fcount()} FILTERS ON</span>`:''}</div></section>${top.length?`<div class="sectionbar"><h2>${fcount()?'Your Matches':'Top Profiles'}</h2><span>Qualification + archetypes</span></div><div class="topstrip">${top.map(x=>`<div class="playercard"><strong>${esc(x.player)}</strong><div class="pm">${esc(x.team)} • #${esc(x.lineup)}</div><div class="tags">${tags(x)}</div>${saveBtn(x)}</div>`).join('')}</div>`:''}<div class="sectionbar"><h2>Slate Board</h2><span>Tap a game</span></div><div class="gameboard">${S.games.map(gameCard).join('')}</div>`;wireDynamic()}
function gameCard(g){const a=g.teams[0]||'—',b=g.teams[1]||'—',s=confirm(g);return`<button class="game" data-game="${esc(g.gamePk)}"><div class="gtop"><div class="matchup">${esc(a)} @ <b>${esc(b)}</b></div><div class="status"><i class="dot ${s==='CONFIRMED'?'c':'p'}"></i>${s}</div></div><div class="meta">${esc(pitcher(g,a))} vs ${esc(pitcher(g,b))}</div><div class="chips"><span class="chip">${g.qualified} core 5/6+</span><span class="chip">${g.confirmed} confirmed slots</span></div></button>`}
function lineup(g,t){return g.all.filter(x=>x.team===t).sort((a,b)=>a.lineup-b.lineup).filter(x=>!fcount()||passFilter(x)).map(x=>`<div class="row ${x.c.core>=5?'qual':''}"><span class="ord">${esc(x.lineup)}</span><div><div class="pn">${esc(x.player)}</div><div class="tags">${tags(x)}</div>${saveBtn(x)}</div></div>`).join('')}
function metrics(p){return[['BAR',p?.barrel,1,'%'],['HH',p?.hh,1,'%'],['BLAST',p?.blast,1,'%'],['AIR',p?.pullair,1,'%'],['EV',p?.ev,1,''],['ISO',p?.iso,3,'']].map(([k,v,d,s])=>`<span class="metric">${k} ${num(v,d)}${s}</span>`).join('')}
function topLooks(g){const xs=g.all.filter(x=>x.p).filter(x=>!fcount()||passFilter(x)).sort((a,b)=>b.c.core-a.c.core||a.lineup-b.lineup).slice(0,6);return xs.length?xs.map(x=>`<div class="playercard" style="width:100%;margin-bottom:8px"><strong>${esc(x.player)} • ${esc(x.team)}</strong><div class="tags">${tags(x)}</div><div class="metricstrip">${metrics(x.p)}</div>${saveBtn(x)}</div>`).join(''):'<div class="empty">No hitters match this view.</div>'}
function detail(){const g=S.games.find(x=>String(x.gamePk)===String(S.active));if(!g)return board();const a=g.teams[0]||'—',b=g.teams[1]||'—';let body='';if(S.tab==='lineups')body=`<div class="linegrid"><div class="team"><div class="th"><b>${esc(a)}</b><span>${confirm(g)}</span></div>${lineup(g,a)}</div><div class="team"><div class="th"><b>${esc(b)}</b><span>${confirm(g)}</span></div>${lineup(g,b)}</div></div>`;else if(S.tab==='top')body=topLooks(g);else if(S.tab==='props')body='<div class="empty">Props stay disabled until an approved real prop feed is connected.</div>';else body='<div class="empty">Starter, bullpen, weather and park context remain available in the underlying research layer; this app view is being simplified before those cards are reintroduced.</div>';$('#screen').innerHTML=`<div class="detailtop"><button class="back" id="back">‹ BOARD</button></div><section class="detail"><div class="dhead"><div class="eyebrow">MATCHUP</div><h1>${esc(a)} @ <span style="color:var(--red2)">${esc(b)}</span></h1><div class="sub">${esc(a)} vs ${esc(pitcher(g,a))} • ${esc(b)} vs ${esc(pitcher(g,b))}</div><div class="chips" style="margin-top:10px"><span class="chip">${confirm(g)} LINEUPS</span><span class="chip">${g.qualified} CORE 5/6+</span></div></div><div class="tabs"><button class="tab ${S.tab==='lineups'?'on':''}" data-tab="lineups">LINEUPS</button><button class="tab ${S.tab==='top'?'on':''}" data-tab="top">TOP LOOKS</button><button class="tab ${S.tab==='props'?'on':''}" data-tab="props">PROPS</button><button class="tab ${S.tab==='insights'?'on':''}" data-tab="insights">INSIGHTS</button></div><div class="panel">${body}</div></section>`;$('#back').onclick=()=>{S.view='board';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});wireDynamic()}
function filters(){const opts=[['foundation','Foundation','5/6 qualifies • 6/6 elite'],['pullPower','Pull Power','5/6 qualifies • 6/6 elite'],['barrelMonster','Barrel Monster','5/6 qualifies • 6/6 elite'],['eliteContact','Elite Contact Watch','Contact override watch'],['longshot','Longshot Profile','4/6 core profile • +700 required for qualified longshot'],['confirmed','Confirmed Lineups','Lineup status only']];$('#screen').innerHTML=`<section class="filterbox"><div class="eyebrow">FILTERS</div><h1>Build Your View</h1><div class="sub">5/6 and 6/6 are qualification levels inside the archetypes — not standalone filters.</div><div class="filtergrid">${opts.map(([k,l,s])=>`<button class="fbtn ${S.filters[k]?'on':''}" data-filter="${k}"><b>${l}</b><span>${s}</span></button>`).join('')}</div><div class="actions"><button class="action red" id="view">VIEW MATCHES</button><button class="action" id="reset">RESET</button></div><div class="note">Longshot Profile shows 4/6 core-profile hitters even when price data is unavailable. A hitter is only marked as a qualified longshot when live HR odds confirm +700 or longer. Current market status: ${esc(S.marketMessage)}.</div></section>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.filters[b.dataset.filter]=!S.filters[b.dataset.filter];localStorage.setItem(FILTER,JSON.stringify(S.filters));filters()});$('#reset').onclick=()=>{S.filters={...defaults};localStorage.setItem(FILTER,JSON.stringify(S.filters));filters()};$('#view').onclick=()=>{S.view='board';render()}}
function picks(){const xs=Object.keys(S.picks).map(id=>S.games.flatMap(g=>g.all).find(x=>String(x.player_id)===id)).filter(Boolean);$('#screen').innerHTML=`<section class="hero"><div class="eyebrow">MY PICKS</div><h1>${xs.length?`${xs.length} Saved`:'No Picks Yet'}</h1><div class="sub">Only hitters you save appear here.</div></section>${xs.map(x=>`<div class="playercard" style="width:100%;margin-bottom:8px"><strong>${esc(x.player)}</strong><div class="tags">${tags(x)}</div>${saveBtn(x)}</div>`).join('')||'<div class="empty">Tap ☆ SAVE on any hitter.</div>'}`;wireDynamic()}
function more(){$('#screen').innerHTML='<section class="hero"><div class="eyebrow">BANDALYTICS</div><h1>Data first.</h1><div class="sub">Archetypes describe hitter profiles. Qualification levels describe how strongly a hitter meets an archetype. Filters only customize what you see. My Picks stores only your choices.</div></section>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.view||(S.view==='game'&&b.dataset.nav==='games')));if(S.view==='filters')filters();else if(S.view==='picks')picks();else if(S.view==='more')more();else if(S.view==='game')detail();else board()}
function wireDynamic(){document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{S.active=b.dataset.game;S.view='game';S.tab='lineups';render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=String(b.dataset.save),x=S.games.flatMap(g=>g.all).find(v=>String(v.player_id)===id);if(!x)return;if(S.picks[id])delete S.picks[id];else S.picks[id]={player_id:+id,player:x.player,team:x.team};localStorage.setItem(PICK,JSON.stringify(S.picks));render()})}
async function loadProfiles(){const ids=[...new Set(S.items.map(x=>+x.player_id).filter(Number.isInteger))],chunks=[];for(let i=0;i<ids.length;i+=30)chunks.push(ids.slice(i,i+30));let idx=0;const work=async()=>{while(idx<chunks.length){const c=chunks[idx++];try{const z=await get('/api/profile-v38-candidate?ids='+c.join(',')+'&year=2026',2);for(const p of z.items||[])S.profiles.set(+p.player_id,p);build();render()}catch{}}};await Promise.all([work(),work(),work()]);build();render()}
async function loadMarket(){try{const z=await get('/api/market-native?date='+encodeURIComponent(S.date),0);S.marketConnected=z.live_market_connected===true;for(const r of z.rows||[])if(Number.isInteger(+r.player_id))S.market.set(+r.player_id,r);S.marketMessage=S.marketConnected?`${S.market.size} live HR prices loaded`:'Price feed unavailable'}catch(e){S.marketConnected=false;S.marketMessage='Live HR price feed not connected';}build();render()}
async function init(){try{const z=await get('/api/projected-lineups?date='+encodeURIComponent(S.date),1);S.items=z.items||[];build();$('#loadState').textContent='Slate loaded';render();loadProfiles();loadMarket()}catch(e){$('#loadState').textContent='Load error';$('#screen').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.nav==='games'?'board':b.dataset.nav;render()});window.__BANDALYTICS_MOBILE_V7={researchOnly:true,profileGateChanged:false,longshotRuleChanged:false,scoringChanged:false,userFiltersOnly:true,qualificationLevelsNotFilters:true,longshotProfileVisibleWithoutMarket:true,longshotQualifiedRequires700:true};init();})();
</script></body></html>
